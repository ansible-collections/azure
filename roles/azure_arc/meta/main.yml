---
galaxy_info:
  author: Bill Peck, Klaas Demter and Stefano Ochoa
  description: Role to setup ARC on an existing host.

  standalone: false

  license: GPL-3.0-or-later

  min_ansible_version: 2.16.0

  # Supported platforms: see https://learn.microsoft.com/en-us/azure/azure-arc/servers/prerequisites#supported-operating-systems for Azure Arc supported Linux distributions.
  platforms:
    # Actual supported: "8", "9" (see Azure Arc docs)
    # Galaxy schema doesn't support these version strings, so using 'all'
    - name: AlmaLinux
      versions:
        - all
    # Actual supported: "2", "2023" (see Azure Arc docs)
    - name: Amazon Linux
      versions:
        - all
    # Actual supported: "bullseye", "bookworm" (see Azure Arc docs)
    - name: Debian
      versions:
        - all
    # Actual supported: "7", "8", "9", "10" (see Azure Arc docs)
    - name: EL
      versions:
        - all
    - name: Rocky
      versions:
        - all
    # Actual supported: 12 SP5, 15 SP3-SP7 (see Azure Arc docs)
    - name: SLES
      versions:
        - all
    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
        - noble

  galaxy_tags:
    - linux
    - system
    - ansible
    - microsoft
    - azure
    - arc

dependencies: []
collections: []
...
