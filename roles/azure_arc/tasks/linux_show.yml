---
- name: Get azcmagent status
  become: true
  ansible.builtin.command:
    cmd: azcmagent show --json
  register: azure_arc_show_json
  # This command never changes anything, we get a config setting to verify it's already set properly
  changed_when: false
  # Always run in execute mode, even when checking
  check_mode: false
  # The himds service can be restarting right after an agent install or
  # upgrade. azcmagent show already retries its service connection internally
  # for a while, so a few additional retries cover systemd restart backoff.
  until: azure_arc_show_json.rc == 0
  retries: 3
  delay: 60
