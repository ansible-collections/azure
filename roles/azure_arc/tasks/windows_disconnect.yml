---
- name: Use azure arc agent to disconnect from azure
  ansible.builtin.raw: >-
    & "{{ ansible_env['ProgramFiles'] }}/AzureConnectedMachineAgent/azcmagent.exe"
    disconnect
    --access-token "{{ azure_arc_access_token.access_token }}"
    {{ "--force-local-only" if azure_arc_force_local_only | bool else "" }}
    --json
  no_log: true
  # If this command is run, it will always change the connection status from connected to disconnected
  changed_when: true
  failed_when: false
  register: azure_arc_azcmagent_disconnect_json
