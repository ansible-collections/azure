- name: Create a new resource group for ml-component test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-ml-component"
    location: eastus

- name: For ml-component topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-ml-component"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        new_resource_group: "{{ resource_group }}-ml-component"
        workspace_name: "workspace-{{ rpfx }}"
        component_name: "component{{ rpfx }}"

    - name: Create ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        location: "{{ location }}"
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        public_network_access: Enabled
      register: results

    - name: Assert the ML Workspace created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Component
      azure.azcollection.azure_rm_ml_component:
        name: "{{ component_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
          name: my_train
          display_name: Train_upper_case
          type: command
          inputs:
            training_data:
              type: uri_folder
            max_epocs:
              type: integer
              min: 0
              max: 100
            learning_rate:
              type: number
              default: 0.01
            learning_rate_schedule:
              type: string
              default: time-based
              enum:
                  - "step"
                  - "time-based"
          outputs:
            model_output:
              type: uri_folder
          code: ./targets/azure_rm_ml_component/files/train_src
          environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
          command: >-
            python train.py
            --training_data ${{ '{{' }}inputs.training_data{{ '}}' }}
            --max_epocs ${{ '{{' }}inputs.max_epocs{{ '}}' }}
            --learning_rate ${{ '{{' }}inputs.learning_rate{{ '}}' }}
            --learning_rate_schedule ${{ '{{' }}inputs.learning_rate_schedule{{ '}}' }}
            --model_output ${{ '{{' }}outputs.model_output{{ '}}' }}
      register: results

    - name: Assert the ML Component created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Component (idempotent)
      azure.azcollection.azure_rm_ml_component:
        name: "{{ component_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
          name: my_train
          display_name: Train_upper_case
          type: command
          inputs:
            training_data:
              type: uri_folder
            max_epocs:
              type: integer
              min: 0
              max: 100
            learning_rate:
              type: number
              default: 0.01
            learning_rate_schedule:
              type: string
              default: time-based
              enum:
                  - "step"
                  - "time-based"
          outputs:
            model_output:
              type: uri_folder
          code: ./targets/azure_rm_ml_component/files/train_src
          environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
          command: >-
            python train.py
            --training_data ${{ '{{' }}inputs.training_data{{ '}}' }}
            --max_epocs ${{ '{{' }}inputs.max_epocs{{ '}}' }}
            --learning_rate ${{ '{{' }}inputs.learning_rate{{ '}}' }}
            --learning_rate_schedule ${{ '{{' }}inputs.learning_rate_schedule{{ '}}' }}
            --model_output ${{ '{{' }}outputs.model_output{{ '}}' }}
      register: results

    - name: Assert the ML Component created (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: Create Component (version 2)
      azure.azcollection.azure_rm_ml_component:
        name: "{{ component_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 2
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
          name: my_train
          display_name: Train_upper_case
          type: command
          inputs:
            training_data:
              type: uri_folder
            max_epocs:
              type: integer
              min: 0
              max: 100
            learning_rate:
              type: number
              default: 0.01
            learning_rate_schedule:
              type: string
              default: time-based
              enum:
                  - "step"
                  - "time-based"
          outputs:
            model_output:
              type: uri_folder
          code: ./targets/azure_rm_ml_component/files/train_src
          environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
          command: >-
            python train.py
            --training_data ${{ '{{' }}inputs.training_data{{ '}}' }}
            --max_epocs ${{ '{{' }}inputs.max_epocs{{ '}}' }}
            --learning_rate ${{ '{{' }}inputs.learning_rate{{ '}}' }}
            --learning_rate_schedule ${{ '{{' }}inputs.learning_rate_schedule{{ '}}' }}
            --model_output ${{ '{{' }}outputs.model_output{{ '}}' }}
      register: results

    - name: Assert the ML Component created (version 2)
      ansible.builtin.assert:
        that:
          - results is changed

    - name: List ML Component (archived)
      azure.azcollection.azure_rm_ml_component_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived components are zero
      ansible.builtin.assert:
        that:
          - results.ml_components | length == 0

    - name: Archive Component
      azure.azcollection.azure_rm_ml_component:
        name: "{{ component_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Component is archived
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Archive Component (idempotent)
      azure.azcollection.azure_rm_ml_component:
        name: "{{ component_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Component is archived (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: List ML Component (archived)
      azure.azcollection.azure_rm_ml_component_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived components are one
      ansible.builtin.assert:
        that:
          - results.ml_components | length == 1

    # cleanup
    - name: Delete ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        all_resources: true
        permanently_delete: true
        state: absent
      register: results

    - name: Assert the ML Workspace deleted
      ansible.builtin.assert:
        that: results is changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ new_resource_group }}"
        force_delete_nonempty: true
        state: absent
