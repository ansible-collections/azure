- name: Create a new resource group for private endpoint test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-privateendpoint"
    location: westus2

- name: For private endpoint test
  block:
    - name: Set Private Endpoint Name
      ansible.builtin.set_fact:
        rpfx: "private{{ resource_group | hash('md5') | truncate(18, True, '') }}"
        password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', 'punctuation'], length=12) }}"

    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: vnet{{ rpfx }}
        address_prefixes_cidr:
          - 10.1.0.0/16
        dns_servers:
          - 127.0.0.1
          - 127.0.0.3
        resource_group: "{{ resource_group }}-privateendpoint"

    - name: Create network security group
      azure.azcollection.azure_rm_securitygroup:
        name: secgroup{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"

    - name: Create the subnet
      azure.azcollection.azure_rm_subnet:
        name: subnet{{ rpfx }}
        virtual_network_name: vnet{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        address_prefix_cidr: "10.1.0.0/16"
        security_group: secgroup{{ rpfx }}
        private_endpoint_network_policies: Disabled
        private_link_service_network_policies: Disabled
        service_endpoints:
          - service: Microsoft.Sql
            locations:
              - eastus
              - westus
      register: subnet_output

    - name: Create instance of postgresql flexible server --- first
      azure.azcollection.azure_rm_postgresqlflexibleserver:
        resource_group: "{{ resource_group }}-privateendpoint"
        name: "postflexible{{ rpfx }}"
        sku:
          name: Standard_B1ms
          tier: Burstable
        administrator_login: azureuser
        administrator_login_password: "{{ password }}"
        version: 12
        storage:
          storage_size_gb: 128
        fully_qualified_domain_name: st-private-dns-zone.postgres.database.azure.com
        backup:
          backup_retention_days: 7
          geo_redundant_backup: Disabled
        network:
          public_network_access: Disabled
        maintenance_window:
          custom_window: Enabled
          start_hour: 8
          start_minute: 4
          day_of_week: 3
        availability_zone: 2
        create_mode: Create
      register: post_output

    - name: Create instance of postgresql flexible server --- secondary
      azure.azcollection.azure_rm_postgresqlflexibleserver:
        resource_group: "{{ resource_group }}-privateendpoint"
        name: "postflexible{{ rpfx }}02"
        sku:
          name: Standard_B1ms
          tier: Burstable
        administrator_login: azureuser
        administrator_login_password: "{{ password }}"
        version: 12
        storage:
          storage_size_gb: 128
        fully_qualified_domain_name: st-private-dns-zone.postgres.database.azure.com
        backup:
          backup_retention_days: 7
          geo_redundant_backup: Disabled
        network:
          public_network_access: Disabled
        maintenance_window:
          custom_window: Enabled
          start_hour: 8
          start_minute: 4
          day_of_week: 3
        availability_zone: 2
        create_mode: Create
      register: post_output02

    - name: Create instance of postgresql flexible server --- third
      azure.azcollection.azure_rm_postgresqlflexibleserver:
        resource_group: "{{ resource_group }}-privateendpoint"
        name: "postflexible{{ rpfx }}03"
        sku:
          name: Standard_B1ms
          tier: Burstable
        administrator_login: azureuser
        administrator_login_password: "{{ password }}"
        version: 12
        storage:
          storage_size_gb: 128
        fully_qualified_domain_name: st-private-dns-zone.postgres.database.azure.com
        backup:
          backup_retention_days: 7
          geo_redundant_backup: Disabled
        network:
          public_network_access: Disabled
        maintenance_window:
          custom_window: Enabled
          start_hour: 8
          start_minute: 4
          day_of_week: 3
        availability_zone: 2
        create_mode: Create
      register: post_output03

    - name: Delete private endpoint, makesure there is no private endpoint exist
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        state: absent

    - name: Create private endpoint
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        private_link_service_connections:
          - name: privateEndpoints_test_name
            private_link_service_id: "{{ post_output.state.id }}"
            group_ids:
              - postgresqlServer
        subnet:
          id: "{{ subnet_output.state.id }}"
        tags:
          key1: value1
        cert_validation_mode: ignore
      register: output

    - name: Assert status succeeded and results match expectations
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.id is defined
          - output.state.provisioning_state == "Succeeded"
          - output.state.tags | length == 1

    - name: Create private endpoint ( Idempotent Test)
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        private_link_service_connections:
          - name: privateEndpoints_test_name
            private_link_service_id: "{{ post_output.state.id }}"
            group_ids:
              - postgresqlServer
        subnet:
          id: "{{ subnet_output.state.id }}"
        tags:
          key1: value1
      register: output

    - name: Assert status succeeded and results match expectations
      ansible.builtin.assert:
        that:
          - output is not changed
      ignore_errors: true
      register: ignore_errors_register

    - name: Update private endpoint with tags
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        private_link_service_connections:
          - name: privateEndpoints_test_name
            private_link_service_id: "{{ post_output.state.id }}"
            group_ids:
              - postgresqlServer
        subnet:
          id: "{{ subnet_output.state.id }}"
        tags:
          key1: value1
          key2: value2
      register: output

    - name: Assert status succeeded and results match expectations
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.tags | length == 2

    - name: Get private endpoint info
      azure.azcollection.azure_rm_privateendpoint_info:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
      register: output

    - name: Assert private endpoint info
      ansible.builtin.assert:
        that:
          - output.privateendpoints[0].provisioning_state == "Succeeded"
          - output.privateendpoints[0].tags | length == 2

    - name: Create secondary private endpoint with manual_private_link_service_connections parameters
      azure.azcollection.azure_rm_privateendpoint:
        name: "privateendpoint{{ rpfx }}02"
        resource_group: "{{ resource_group }}-privateendpoint"
        manual_private_link_service_connections:
          - name: privateEndpoints_test_name02
            private_link_service_id: "{{ post_output02.state.id }}"
            group_ids:
              - postgresqlServer
        subnet:
          id: "{{ subnet_output.state.id }}"
      register: output

    - name: Assert the secondary private endpoint created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create an application security group
      azure.azcollection.azure_rm_applicationsecuritygroup:
        resource_group: "{{ resource_group }}-privateendpoint"
        name: "app{{ rpfx }}"
        location: westus2

    - name: Get the application security group facts
      azure.azcollection.azure_rm_applicationsecuritygroup_info:
        resource_group: "{{ resource_group }}-privateendpoint"
        name: "app{{ rpfx }}"
      register: app_group_output

    - name: Create third private endpoint with manual_private_link_service_connections parameters
      azure.azcollection.azure_rm_privateendpoint:
        name: "privateendpoint{{ rpfx }}03"
        resource_group: "{{ resource_group }}-privateendpoint"
        private_link_service_connections:
          - name: privateEndpoints_test_name
            private_link_service_id: "{{ post_output03.state.id }}"
            group_ids:
              - postgresqlServer
        subnet:
          id: "{{ subnet_output.state.id }}"
        application_security_groups:
          - id: "{{ app_group_output.applicationsecuritygroups[0].id }}"
        ip_configurations:
          - name: ipc01
            group_id: postgresqlServer
            member_name: postgresqlServer
            private_ip_address: 10.1.0.9
        custom_dns_configs:
          - fqdn: customdns01
            ip_addresses:
              - 10.1.0.9
      register: output

    - name: Assert the secondary private endpoint created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete the third private endpoint
      azure.azcollection.azure_rm_privateendpoint:
        name: "privateendpoint{{ rpfx }}03"
        resource_group: "{{ resource_group }}-privateendpoint"
        state: absent
      register: output

    - name: Delete the secondary private endpoint
      azure.azcollection.azure_rm_privateendpoint:
        name: "privateendpoint{{ rpfx }}02"
        resource_group: "{{ resource_group }}-privateendpoint"
        state: absent
      register: output

    - name: Delete private endpoint
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        state: absent
      register: output

    - name: Assert status succeeded and results match expectations
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete private endpoint ( Idempotent Test)
      azure.azcollection.azure_rm_privateendpoint:
        name: privateendpoint{{ rpfx }}
        resource_group: "{{ resource_group }}-privateendpoint"
        state: absent
      register: output

    - name: Assert status succeeded and results match expectations
      ansible.builtin.assert:
        that:
          - output is not changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-privateendpoint"
        force_delete_nonempty: true
        state: absent
