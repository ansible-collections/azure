- name: Create a new resource group for service bus test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-servicebus"
    location: eastus

- name: For service bus test
  block:
    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-servicebus"
      register: __rg_info

    - name: Prepare random number
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
        location: "{{ __rg_info.resourcegroups.0.location }}"
      run_once: true

    - name: Create identities array
      ansible.builtin.set_fact:
        managed_identity_ids: []
        new_resource_group: "{{ resource_group }}-servicebus"

    - name: Create user managed identities
      ansible.builtin.include_tasks: "{{ role_path }}/../../../integration_common_tasks/managed_identity.yml"
      vars:
        managed_identity_test_unique: 'servicebus'
        managed_identity_unique: "{{ item }}"
        managed_identity_action: 'create'
        managed_identity_location: "{{ location }}"
        resource_group: "{{ new_resource_group }}"
      with_items:
        - '1'
        - '2'
        - '3'

    - name: Create a namespace
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        tags:
          key1: value1
      register: output

    - name: Assert the namespace created
      ansible.builtin.assert:
        that:
          - output.id is defined
          - output is changed
          - output.tags is defined

    - name: Create a namespace (idempontent)
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update namespace - ManagedIdentity SystemAssigned
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        identity:
          type: SystemAssigned
      register: output

    - name: Assert SystemAssigned
      ansible.builtin.assert:
        that:
          - output is changed
          - output.identity.type == "SystemAssigned"

    - name: Gather facts
      azure.azcollection.azure_rm_servicebus_info:
        name: "ns{{ rpfx }}"
        type: namespace
        resource_group: "{{ resource_group }}-servicebus"
      register: facts

    - name: Debug
      ansible.builtin.debug:
        var: facts

    - name: Update namespace - ManagedIdentity UserAssigned
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        identity:
          type: UserAssigned
          user_assigned_identities:
            id:
              - "{{ managed_identity_ids[0] }}"
      register: output

    - name: Assert UserAssigned
      ansible.builtin.assert:
        that:
          - output is changed
          - output.identity.type == "UserAssigned"
          - output.identity.user_assigned_identities | length == 1
          - output.identity.user_assigned_identities[managed_identity_ids[0]] is defined

    - name: Update namespace - ManagedIdentity UserAssigned Append
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        identity:
          type: UserAssigned
          user_assigned_identities:
            id:
              - "{{ managed_identity_ids[1] }}"
      register: output

    - name: Assert UserAssigned
      ansible.builtin.assert:
        that:
          - output is changed
          - output.identity.type == "UserAssigned"
          - output.identity.user_assigned_identities | length == 2
          - output.identity.user_assigned_identities[managed_identity_ids[0]] is defined
          - output.identity.user_assigned_identities[managed_identity_ids[1]] is defined

    - name: Update namespace - ManagedIdentity UserAssigned Append false
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        identity:
          type: UserAssigned
          user_assigned_identities:
            id:
              - "{{ managed_identity_ids[2] }}"
            append: false
      register: output

    - name: Assert UserAssigned
      ansible.builtin.assert:
        that:
          - output is changed
          - output.identity.type == "UserAssigned"
          - output.identity.user_assigned_identities | length == 1
          - output.identity.user_assigned_identities[managed_identity_ids[2]] is defined

    - name: Create a secondary namespace
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}02"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        minimum_tls_version: '1.1'
        zone_redundant: false
        disable_local_auth: true
        public_network_access: Disabled
        premium_messaging_partitions: 1
        tags:
          key1: value1
      register: output

    - name: Assert the service bus created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Update the secondary namespace
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}02"
        resource_group: "{{ resource_group }}-servicebus"
        sku: premium
        minimum_tls_version: '1.2'
        zone_redundant: false
        disable_local_auth: false
        public_network_access: Enabled
        premium_messaging_partitions: 1
        tags:
          key1: value1
      register: output

    - name: Assert the service bus updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Gather the namespace facts
      azure.azcollection.azure_rm_servicebus_info:
        name: "ns{{ rpfx }}"
        type: namespace
        resource_group: "{{ resource_group }}-servicebus"
      register: facts

    - name: Assert the facts
      ansible.builtin.assert:
        that:
          - facts.servicebuses[0].disable_local_auth is false
          # The default value of zone_redundant is True and cannot be set
          # - facts.servicebuses[0].zone_redundant is false
          - facts.servicebuses[0].minimum_tls_version == '1.2'
          - facts.servicebuses[0].public_network_access == 'Enabled'
          - facts.servicebuses[0].premium_messaging_partitions == 1

    - name: Create a queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queue{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        max_message_size_in_kb: 2048
        max_size_in_mb: 2048
      register: queue

    - name: Assert the queue created
      ansible.builtin.assert:
        that:
          - queue.id is defined
          - queue is changed
          - queue.max_message_size_in_kb == 2048

    - name: Create a queue with duplicate detection
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        requires_duplicate_detection: true
        max_delivery_count: 5
      register: queuedd_output

    - name: Assert duplicate detection enabled on the queue
      ansible.builtin.assert:
        that:
          - queuedd_output is changed
          - queuedd_output.requires_duplicate_detection is true

    - name: Disable duplicate detection on the existing queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        requires_duplicate_detection: false
      register: queuedd_output
      ignore_errors: true

    - name: Assert the queue duplicate detection change is rejected
      ansible.builtin.assert:
        that:
          - queuedd_output is failed
          - "'cannot be changed' in queuedd_output.msg"

    - name: Enable sessions on the existing queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        requires_session: true
      register: queuedd_output
      ignore_errors: true

    - name: Assert the queue session change is rejected
      ansible.builtin.assert:
        that:
          - queuedd_output is failed
          - "'cannot be changed' in queuedd_output.msg"

    - name: Update only max_size_in_mb on the queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        max_size_in_mb: 2048
      register: queuedd_output

    - name: Assert unspecified queue options are preserved
      ansible.builtin.assert:
        that:
          - queuedd_output is changed
          - queuedd_output.max_size_in_mb == 2048
          - queuedd_output.max_delivery_count == 5
          - queuedd_output.requires_duplicate_detection is true

    - name: Update only max_size_in_mb on the queue (idempotent)
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        max_size_in_mb: 2048
      register: queuedd_output

    - name: Assert the queue update is idempotent
      ansible.builtin.assert:
        that:
          - queuedd_output is not changed

    - name: Disable batched operations and receiving on the queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        enable_batched_operations: false
        status: receive_disabled
      register: queuedd_output

    - name: Assert queue false and status updates are applied and other options preserved
      ansible.builtin.assert:
        that:
          - queuedd_output is changed
          - queuedd_output.enable_batched_operations is false
          - queuedd_output.status == 'receive_disabled'
          - queuedd_output.max_delivery_count == 5

    - name: Disable batched operations and receiving on the queue (idempotent)
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        enable_batched_operations: false
        status: receive_disabled
      register: queuedd_output

    - name: Assert the queue status update is idempotent
      ansible.builtin.assert:
        that:
          - queuedd_output is not changed

    - name: Delete the duplicate detection queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queuedd{{ rpfx }}"
        namespace: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        state: absent

    - name: Create a topic (check mode)
      azure.azcollection.azure_rm_servicebustopic:
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        duplicate_detection_time_in_seconds: 600
        max_message_size_in_kb: 2048
        max_size_in_mb: 2048
      check_mode: true
      register: output

    - name: Assert the check mode
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a topic
      azure.azcollection.azure_rm_servicebustopic:
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        duplicate_detection_time_in_seconds: 600
        max_message_size_in_kb: 2048
        max_size_in_mb: 2048
      register: output

    - name: Assert the topic created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined
          - output.subscription_count == 0
          - output.max_message_size_in_kb == 2048

    - name: Create a topic (idempontent)
      azure.azcollection.azure_rm_servicebustopic:
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        duplicate_detection_time_in_seconds: 600
        max_message_size_in_kb: 2048
        max_size_in_mb: 2048
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Create a topic with duplicate detection
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        requires_duplicate_detection: true
        duplicate_detection_time_in_seconds: 600
      register: topicdd_output

    - name: Assert duplicate detection enabled on the topic
      ansible.builtin.assert:
        that:
          - topicdd_output is changed
          - topicdd_output.requires_duplicate_detection is true
          - topicdd_output.duplicate_detection_time_in_seconds == 600

    - name: Update the topic without requires_duplicate_detection
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        duplicate_detection_time_in_seconds: 1200
      register: topicdd_output

    - name: Assert duplicate detection preserved on the topic
      ansible.builtin.assert:
        that:
          - topicdd_output is changed
          - topicdd_output.requires_duplicate_detection is true
          - topicdd_output.duplicate_detection_time_in_seconds == 1200

    - name: Disable duplicate detection on the existing topic
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        requires_duplicate_detection: false
      register: topicdd_output
      ignore_errors: true

    - name: Assert the topic change is rejected
      ansible.builtin.assert:
        that:
          - topicdd_output is failed
          - "'cannot be changed' in topicdd_output.msg"

    - name: Update the topic duplicate detection window (check mode)
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        duplicate_detection_time_in_seconds: 1800
      check_mode: true
      register: topicdd_output

    - name: Assert the check mode update reports a change
      ansible.builtin.assert:
        that:
          - topicdd_output is changed

    - name: Disable batched operations and sending on the topic
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        enable_batched_operations: false
        status: send_disabled
      register: topicdd_output

    - name: Assert false and status updates are applied and other options preserved
      ansible.builtin.assert:
        that:
          - topicdd_output is changed
          - topicdd_output.enable_batched_operations is false
          - topicdd_output.status == 'send_disabled'
          - topicdd_output.requires_duplicate_detection is true
          - topicdd_output.duplicate_detection_time_in_seconds == 1200

    - name: Disable batched operations and sending on the topic (idempotent)
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        enable_batched_operations: false
        status: send_disabled
      register: topicdd_output

    - name: Assert the topic update is idempotent
      ansible.builtin.assert:
        that:
          - topicdd_output is not changed

    - name: Delete the duplicate detection topic
      azure.azcollection.azure_rm_servicebustopic:
        name: "topicdd{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        state: absent

    - name: Create test policy
      azure.azcollection.azure_rm_servicebussaspolicy:
        name: testpolicy
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        rights: manage

    - name: Create a subscription
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
      register: subs

    - name: Assert the subscription created
      ansible.builtin.assert:
        that:
          - subs.id is defined
          - subs is changed

    - name: Update the subscription delivery count and batched operations
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        max_delivery_count: 5
        enable_batched_operations: false
      register: subs_output

    - name: Assert the subscription update is applied
      ansible.builtin.assert:
        that:
          - subs_output is changed
          - subs_output.max_delivery_count == 5
          - subs_output.enable_batched_operations is false

    - name: Update only the subscription lock duration
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        lock_duration_in_seconds: 90
      register: subs_output

    - name: Assert unspecified subscription options are preserved
      ansible.builtin.assert:
        that:
          - subs_output is changed
          - subs_output.lock_duration_in_seconds == 90
          - subs_output.max_delivery_count == 5
          - subs_output.enable_batched_operations is false

    - name: Update only the subscription lock duration (idempotent)
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        lock_duration_in_seconds: 90
      register: subs_output

    - name: Assert the subscription update is idempotent
      ansible.builtin.assert:
        that:
          - subs_output is not changed

    - name: Enable sessions on the existing subscription
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        requires_session: true
      register: subs_output
      ignore_errors: true

    - name: Assert the subscription change is rejected
      ansible.builtin.assert:
        that:
          - subs_output is failed
          - "'cannot be changed' in subs_output.msg"

    - name: Retrive topic
      azure.azcollection.azure_rm_servicebus_info:
        type: topic
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        show_sas_policies: true
      register: facts

    - name: Assert the topic facts
      ansible.builtin.assert:
        that:
          - facts.servicebuses | length == 1
          - facts.servicebuses[0].id == output.id
          - facts.servicebuses[0].subscription_count == 1
          - facts.servicebuses[0].sas_policies.testpolicy is defined
          - facts.servicebuses[0].sas_policies.testpolicy.rights == 'manage'

    - name: Delete subscription
      azure.azcollection.azure_rm_servicebustopicsubscription:
        name: "subs{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        topic: "topic{{ rpfx }}"
        state: absent

    - name: Retrive topic
      azure.azcollection.azure_rm_servicebus_info:
        type: topic
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        show_sas_policies: true
      register: facts

    - name: Assert the topic facts
      ansible.builtin.assert:
        that:
          - facts.servicebuses[0].subscription_count == 0
          - facts.servicebuses | length == 1

    - name: Delete topic
      azure.azcollection.azure_rm_servicebustopic:
        name: "topic{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        state: absent

    - name: Retrive topic
      azure.azcollection.azure_rm_servicebus_info:
        name: "topic{{ rpfx }}"
        type: topic
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        show_sas_policies: true
      register: facts

    - name: Assert the topic facts
      ansible.builtin.assert:
        that:
          - facts.servicebuses | length == 0

    - name: Delete queue
      azure.azcollection.azure_rm_servicebusqueue:
        name: "queue{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        namespace: "ns{{ rpfx }}"
        state: absent

    - name: Delete namespace
      azure.azcollection.azure_rm_servicebus:
        name: "ns{{ rpfx }}"
        resource_group: "{{ resource_group }}-servicebus"
        state: absent

    - name: Delete user managed identities
      ansible.builtin.include_tasks: "{{ role_path }}/../../../integration_common_tasks/managed_identity.yml"
      vars:
        managed_identity_test_unique: 'servicebus'
        managed_identity_unique: "{{ item }}"
        managed_identity_action: 'delete'
        managed_identity_location: "{{ location }}"
        resource_group: "{{ new_resource_group }}"
      with_items:
        - '1'
        - '2'
        - '3'
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-servicebus"
        force_delete_nonempty: true
        state: absent
