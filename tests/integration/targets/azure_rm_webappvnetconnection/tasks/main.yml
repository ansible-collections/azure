- name: Create a new resource group for webapp vnet connection test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-webappvnetconnection"
    location: westus2

- name: For webapp vnet connection test
  block:
    - name: Prepare random number
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Create a virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: vnet{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        address_prefixes_cidr:
          - 10.1.0.0/16
          - 172.100.0.0/16
        dns_servers:
          - 127.0.0.1
          - 127.0.0.2
    - name: Create a subnet
      azure.azcollection.azure_rm_subnet:
        name: subnet{{ rpfx }}
        virtual_network_name: vnet{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        address_prefix_cidr: 10.1.0.0/24
        delegations:
          - name: 'mydeleg'
            serviceName: 'Microsoft.Web/serverFarms'
      register: subnet_output
    - name: Create a web app
      azure.azcollection.azure_rm_webapp:
        resource_group: "{{ resource_group }}-webappvnetconnection"
        name: webapp{{ rpfx }}
        plan:
          resource_group: "{{ resource_group }}-webappvnetconnection"
          name: webappplan{{ rpfx }}
          is_linux: false
          sku: B1

    - name: "Create webapp vnetconnection - check mode"
      azure.azcollection.azure_rm_webappvnetconnection:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        vnet_name: vnet{{ rpfx }}
        subnet: subnet{{ rpfx }}
      check_mode: true
      register: output
    - name: Assert the resource is well created
      ansible.builtin.assert:
        that: output is changed

    - name: "Check webapp vnetconnection facts 1"
      azure.azcollection.azure_rm_webappvnetconnection_info:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
      register: output
    - name: Assert the resource has no connections
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.connection | length == 0

    - name: "Create webapp vnetconnection"
      azure.azcollection.azure_rm_webappvnetconnection:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        vnet_name: vnet{{ rpfx }}
        subnet: subnet{{ rpfx }}
      register: output
    - name: Assert the resource is well created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.connection.vnet_name == 'vnet{{ rpfx }}'
          - output.connection.subnet_name == 'subnet{{ rpfx }}'
          - output.connection.vnet_resource_group == '{{ resource_group }}-webappvnetconnection'

    - name: "Check webapp vnetconnection facts 2"
      azure.azcollection.azure_rm_webappvnetconnection_info:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
      register: output
    - name: Assert the connection exists
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.connection.vnet_name == 'vnet{{ rpfx }}'
          - output.connection.subnet_name == 'subnet{{ rpfx }}'
          - output.connection.vnet_resource_group == '{{ resource_group }}-webappvnetconnection'

    - name: "Create webapp vnetconnection - idempotent"
      azure.azcollection.azure_rm_webappvnetconnection:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        vnet_name: vnet{{ rpfx }}
        subnet: subnet{{ rpfx }}
      register: output
    - name: Assert the resource is not changed
      ansible.builtin.assert:
        that: output is not changed

    - name: "Delete webapp vnetconnection"
      azure.azcollection.azure_rm_webappvnetconnection:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        state: "absent"
      register: output
    - name: Assert the connection is deleted
      ansible.builtin.assert:
        that:
          - output is changed
          - output.connection | length == 0

    - name: "Check webapp vnetconnection facts 3"
      azure.azcollection.azure_rm_webappvnetconnection_info:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
      register: output
    - name: Assert the resource has no connections
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.connection | length == 0

    - name: "Delete webapp vnetconnection - idempotent"
      azure.azcollection.azure_rm_webappvnetconnection:
        name: webapp{{ rpfx }}
        resource_group: "{{ resource_group }}-webappvnetconnection"
        state: "absent"
      register: output
    - name: Assert the resource is not changed
      ansible.builtin.assert:
        that: output is not changed

    - name: Delete the web app
      azure.azcollection.azure_rm_webapp:
        resource_group: "{{ resource_group }}-webappvnetconnection"
        name: webapp{{ rpfx }}
        state: absent

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-webappvnetconnection"
        force_delete_nonempty: true
        state: absent
