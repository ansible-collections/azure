---
- name: Config hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set facts
      ansible.builtin.include_vars: vars.yml

    - name: Test vm_name_2 in Inventory
      ansible.builtin.assert:
        that:
          - vm_name_2 in hostvars

    - name: Test vm_name_2 details are still fetched after early filtering
      ansible.builtin.assert:
        that:
          - hostvars[vm_name_2].powerstate == 'running'
          - hostvars[vm_name_2].private_ipv4_addresses | length > 0
          - hostvars[vm_name_2].network_interface | length > 0

    - name: Test vm_name not in Inventory
      ansible.builtin.assert:
        that:
          - vm_name not in hostvars

    - name: Rebuild the inventory with -vv to capture early filtering decisions
      ansible.builtin.command:
        cmd: "ansible-inventory -i {{ lookup('ansible.builtin.env', 'ANSIBLE_INVENTORY') }} --list -vv"
        chdir: "{{ playbook_dir }}/.."
      register: inventory_vv
      changed_when: false

    - name: Test vm_name was excluded before its details were fetched
      ansible.builtin.assert:
        that:
          - ("host '" ~ vm_name ~ "' excluded early by exclude_host_filters") in (inventory_vv.stdout ~ inventory_vv.stderr)

    - name: Exercise early exclusion by include_host_filters
      vars:
        include_config: "{{ playbook_dir }}/../include_filter.azure_rm.yml"
        include_output: "{{ playbook_dir }}/../include_filter_inventory.json"
      block:
        - name: Write an include-only inventory config
          ansible.builtin.copy:
            dest: "{{ include_config }}"
            content: |
              plugin: azure.azcollection.azure_rm
              plain_host_names: true
              include_host_filters:
                - name == '{{ vm_name_2 }}'
            mode: '0644'

        - name: Build the include-only inventory with -vv
          ansible.builtin.command:
            cmd: "ansible-inventory -i {{ include_config }} --list -vv --output {{ include_output }}"
          register: include_vv
          changed_when: false

        - name: Test vm_name was excluded early by include_host_filters and vm_name_2 kept its details
          vars:
            include_hostvars: "{{ (lookup('ansible.builtin.file', include_output) | from_json)['_meta']['hostvars'] }}"
          ansible.builtin.assert:
            that:
              - ("host '" ~ vm_name ~ "' excluded early by include_host_filters") in (include_vv.stdout ~ include_vv.stderr)
              - vm_name not in include_hostvars
              - vm_name_2 in include_hostvars
              - include_hostvars[vm_name_2].powerstate == 'running'
              - include_hostvars[vm_name_2].private_ipv4_addresses | length > 0
              - include_hostvars[vm_name_2].network_interface | length > 0
      always:
        - name: Remove the include-only inventory config and output
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ include_config }}"
            - "{{ include_output }}"
