---
- name: Set hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set facts
      ansible.builtin.include_vars: vars.yml

    - name: Create a new resource group for iventory test
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-inventory"
        location: westus2

    - name: SETUP | Create storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ storage_account }}"
        account_type: Standard_LRS

    - name: SETUP | Create availability set
      azure.azcollection.azure_rm_availabilityset:
        name: "{{ availability_set }}"
        resource_group: "{{ resource_group }}-inventory"

    - name: SETUP | Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ network_name }}"
        address_prefixes: "{{ network }}"

    - name: SETUP | Create virtual network --- secondary
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ network_name_2 }}"
        address_prefixes: "{{ network_2 }}"
        location: eastus

    - name: SETUP | Create subnet
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ subnet_name }}"
        address_prefix: "{{ subnet }}"
        virtual_network: "{{ network_name }}"

    - name: SETUP | Create subnet --- secondary
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ subnet_name_2 }}"
        address_prefix: "{{ subnet_2 }}"
        virtual_network: "{{ network_name_2 }}"

    - name: Create network interface
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ interface_name }}"
        open_ports:
          - 33
        virtual_network: "{{ network_name }}"
        subnet: "{{ subnet_name }}"

    - name: Create network interface --- secondary
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ interface_name_2 }}"
        open_ports:
          - 33
        virtual_network: "{{ network_name_2 }}"
        subnet: "{{ subnet_name_2 }}"

    - name: Create minimal VM with defaults
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ vm_name }}"
        admin_username: testuser
        ssh_password_enabled: false
        open_ports:
          - 33
        ssh_public_keys:
          - path: /home/testuser/.ssh/authorized_keys
            key_data: "ssh-rsa  xiuxi.sun@qq.com"
        vm_size: Standard_B1ms
        virtual_network: "{{ network_name }}"
        network_interfaces: "{{ interface_name }}"
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest
      register: vm_output

    - name: Create minimal VM 2 with defaults
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ vm_name_2 }}"
        started: true
        admin_username: testuser
        ssh_password_enabled: false
        location: eastus
        open_ports:
          - 33
        ssh_public_keys:
          - path: /home/testuser/.ssh/authorized_keys
            key_data: "ssh-rsa  xiuxi.sun@qq.com"
        vm_size: Standard_B1ms
        virtual_network: "{{ network_name_2 }}"
        network_interfaces: "{{ interface_name_2 }}"
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest
        tags:
          AAP_Managed: Local
          Ansible_OS: ubuntu20
          Deployment-Method: Ansible
          Automation-Method: Ansible
      register: vm_output_2
