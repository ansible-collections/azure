---
- name: Config hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set facts
      ansible.builtin.include_vars: vars.yml

    - name: Inventory powerstate is running
      ansible.builtin.assert:
        that:
          - vm_name_2 in hostvars
          - hostvars[vm_name_2].powerstate == "running"

    - name: Show the VM powerstate for the first time
      ansible.builtin.debug:
        var: hostvars[vm_name_2].powerstate

    - name: Power off minimal VM 2
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}-inventory"
        name: "{{ vm_name_2 }}"
        started: false

    - name: Inventory powerstate is still running
      ansible.builtin.assert:
        that:
          - vm_name_2 in hostvars
          - hostvars[vm_name_2].powerstate == "running"

    - name: Show the VM powerstate for the secondary time
      ansible.builtin.debug:
        var: hostvars[vm_name_2].powerstate

    - name: Refresh inventory
      ansible.builtin.meta: refresh_inventory

    - name: Inventory powerstate is stopped
      ansible.builtin.assert:
        that:
          - vm_name_2 in hostvars
          - hostvars[vm_name_2].powerstate == "stopped"

    - name: Show the VM powerstate for the third time
      ansible.builtin.debug:
        var: hostvars[vm_name_2].powerstate
