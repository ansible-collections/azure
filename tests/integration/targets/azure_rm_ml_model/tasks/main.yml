- name: Create a new resource group for ml-model test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-ml-model"
    location: eastus

- name: For ml-model topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-ml-model"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        new_resource_group: "{{ resource_group }}-ml-model"
        workspace_name: "workspace-{{ rpfx }}"
        model_name: "model{{ rpfx }}"

    - name: Create ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        location: "{{ location }}"
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        public_network_access: Enabled
      register: results

    - name: Assert the ML Workspace created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Model
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/model.schema.json
          path: ./targets/azure_rm_ml_model/files/mlflow-model/model.pkl
          description: Model created from local file.
      register: results

    - name: Assert the ML Model created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Model (idempotent)
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/model.schema.json
          path: ./targets/azure_rm_ml_model/files/mlflow-model/model.pkl
          description: Model created from local file.
      register: results

    - name: Assert the ML Model created (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: Create Model (version 2)
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 2
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/model.schema.json
          path: ./targets/azure_rm_ml_model/files/mlflow-model/model.pkl
          description: Model created from local file.
      register: results

    - name: Assert the ML Model created (version 2)
      ansible.builtin.assert:
        that:
          - results is changed

    - name: 'Create Model (version 2) (stage: production)'
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 2
        stage: Production
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/model.schema.json
          path: ./targets/azure_rm_ml_model/files/mlflow-model/model.pkl
          description: Model created from local file.
      register: results

    - name: 'Assert the ML Model created (version 2) (stage: production)'
      ansible.builtin.assert:
        that:
          - results is changed

    - name: List ML Model (archived)
      azure.azcollection.azure_rm_ml_model_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived models are zero
      ansible.builtin.assert:
        that:
          - results.ml_models | length == 0

    - name: Archive Model
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Model is archived
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Archive Model (idempotent)
      azure.azcollection.azure_rm_ml_model:
        name: "{{ model_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Model is archived (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: List ML Model (archived)
      azure.azcollection.azure_rm_ml_model_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived models are one
      ansible.builtin.assert:
        that:
          - results.ml_models | length == 1

    # cleanup
    - name: Delete ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        all_resources: true
        permanently_delete: true
        state: absent
      register: results

    - name: Assert the ML Workspace deleted
      ansible.builtin.assert:
        that: results is changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ new_resource_group }}"
        force_delete_nonempty: true
        state: absent
