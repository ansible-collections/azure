- name: Create a new resource group for express route test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-expressroute"
    location: eastus2

- name: For express route test
  block:
    - name: Create random express route
      ansible.builtin.set_fact:
        express_route: "test{{ resource_group | hash('md5') | truncate(16, True, '') + (65535 | random | string) }}"
        location: eastus2

    - name: Create Express route (check mode)
      azure.azcollection.azure_rm_expressroute:
        location: "{{ location }}"
        name: "{{ express_route }}"
        resource_group: "{{ resource_group }}-expressroute"
        allow_classic_operations: true
        global_reach_enabled: false
        tags:
          a: b
        authorizations:
          - name: authorization_test
        service_provider_properties:
          service_provider_name: Coresite
          peering_location: Denver
          bandwidth_in_mbps: 1000
        sku:
          tier: standard
          family: metereddata
      register: results
      check_mode: true

    - name: Assert the excpress route check mode result
      ansible.builtin.assert:
        that: results is changed


    - name: Create Express route
      azure.azcollection.azure_rm_expressroute:
        location: "{{ location }}"
        name: "{{ express_route }}"
        resource_group: "{{ resource_group }}-expressroute"
        allow_classic_operations: true
        global_reach_enabled: false
        tags:
          a: b
        authorizations:
          - name: authorization_test
        service_provider_properties:
          service_provider_name: Coresite
          peering_location: Denver
          bandwidth_in_mbps: 1000
        sku:
          tier: standard
          family: metereddata
      register: results

    - name: Assert the express route created
      ansible.builtin.assert:
        that: results is changed


    - name: Update Express route
      azure.azcollection.azure_rm_expressroute:
        location: "{{ location }}"
        name: "{{ express_route }}"
        resource_group: "{{ resource_group }}-expressroute"
        allow_classic_operations: true
        global_reach_enabled: false
        tags:
          test: modified
        authorizations:
          - name: authorization_test
        service_provider_properties:
          service_provider_name: Coresite
          peering_location: Denver
          bandwidth_in_mbps: 1000
        sku:
          tier: standard
          family: metereddata
      register: results

    - name: Assert the express route updated
      ansible.builtin.assert:
        that:
          - results is changed
          - results.state.tags.test == 'modified'


    - name: Retrieve Express Route
      azure.azcollection.azure_rm_expressroute_info:
        resource_group: "{{ resource_group }}-expressroute"
        name: "{{ express_route }}"
      register: results

    - name: Assert that facts module returned result
      ansible.builtin.assert:
        that:
          - results.expressroute[0].tags.test == 'modified'
          - results.expressroute[0].type == 'Microsoft.Network/expressRouteCircuits'

    - name: Test idempotent
      azure.azcollection.azure_rm_expressroute:
        name: "{{ express_route }}"
        resource_group: "{{ resource_group }}-expressroute"
      register: results

    - name: Assert the idempotent
      ansible.builtin.assert:
        that:
          - results is not changed

    #
    # azure.azcollection.azure_rm_expressroute cleanup
    #
    - name: Delete Express Route
      azure.azcollection.azure_rm_expressroute:
        resource_group: "{{ resource_group }}-expressroute"
        name: "{{ express_route }}"
        state: absent

    - name: Delete Express Route (idempotent)
      azure.azcollection.azure_rm_expressroute:
        resource_group: "{{ resource_group }}-expressroute"
        name: "{{ express_route }}"
        state: absent
      register: results

    - name: Assert the express route deleted
      ansible.builtin.assert:
        that: results is not changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-expressroute"
        force_delete_nonempty: true
        state: absent
