- name: Create a new resource group for backup policy test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-backuppolicy"
    location: eastus

- name: For backup policy test
  block:
    - name: Set Facts for Tests
      ansible.builtin.set_fact:
        vault_name: "rsv{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        location: "eastus"
        policy_name_daily: "bp-daily-policy-{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        policy_name_daily_enhanced: "bp-daily-policy-{{ resource_group | hash('md5') | truncate(22, True, '') }}-enhanced"
        policy_name_weekly: "bp-weekly-policy-{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        policy_name_long_term: "bp-longterm-policy-{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        policy_name_monthly_daily: "bp-monthly-daily-policy-{{ resource_group | hash('md5') | truncate(22, True, '') }}"

    - name: Create Azure Recovery Service vault
      azure.azcollection.azure_rm_recoveryservicesvault:
        resource_group: "{{ resource_group }}-backuppolicy"
        name: "{{ vault_name }}"
        location: "{{ location }}"
        state: "present"

    - name: Create a daily VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        time_zone: "Pacific Standard Time"
        schedule_run_time: 14
      register: daily_policy_output

    - name: Create a daily VM backup policy
      azure.azcollection.azure_rm_backuppolicy_info:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
      register: backup_policy_exists

    - name: Assert success on daily backup policy creation
      ansible.builtin.assert:
        that:
          - daily_policy_output is changed
          - daily_policy_output.name == policy_name_daily

    - name: Assert Policy Success Retrieving Info
      ansible.builtin.assert:
        that:
          - backup_policy_exists.id == daily_policy_output.id
          - backup_policy_exists.location == daily_policy_output.location
          - backup_policy_exists.name == daily_policy_output.name
          - backup_policy_exists.type == daily_policy_output.type

    - name: Create a daily VM backup policy (idempotent)
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        time_zone: "Pacific Standard Time"
        schedule_run_time: 14
      register: daily_policy_output_idempotent

    - name: Assert that there is no change after second deletion of daily backup policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_idempotent is not changed

    - name: Create a daily enhanced VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        policy_type: V2
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 7
        daily_retention_count: 12
        time_zone: "Pacific Standard Time"
        schedule_run_time: 14
      register: daily_policy_output_enhanced

    - name: Create a daily VM backup policy
      azure.azcollection.azure_rm_backuppolicy_info:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
      register: backup_policy_exists_enhanced

    - name: Assert success on daily backup policy creation
      ansible.builtin.assert:
        that:
          - daily_policy_output_enhanced is changed
          - daily_policy_output_enhanced.name == policy_name_daily_enhanced

    - name: Assert Policy Success Retrieving Info
      ansible.builtin.assert:
        that:
          - backup_policy_exists_enhanced.id == daily_policy_output_enhanced.id
          - backup_policy_exists_enhanced.location == daily_policy_output_enhanced.location
          - backup_policy_exists_enhanced.name == daily_policy_output_enhanced.name
          - backup_policy_exists_enhanced.type == daily_policy_output_enhanced.type

    - name: Check mode idempotence for daily enhanced VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        policy_type: V2
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 7
        daily_retention_count: 12
        time_zone: "Pacific Standard Time"
        schedule_run_time: 14
      check_mode: true
      register: daily_policy_output_enhanced_check_idempotent

    - name: Assert check mode reports no change for unchanged enhanced daily policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_enhanced_check_idempotent is not changed

    - name: Check mode change detection for daily enhanced VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        policy_type: V2
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 8
        daily_retention_count: 12
        time_zone: "Pacific Standard Time"
        schedule_run_time: 14
      check_mode: true
      register: daily_policy_output_enhanced_check_changed

    - name: Assert check mode reports change for modified enhanced daily policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_enhanced_check_changed is changed

    - name: Update daily VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 5
        daily_retention_count: 10
        time_zone: "Pacific Standard Time"
        schedule_run_time: 10
      register: daily_policy_output_update

    - name: Assert success on update of daily policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_update is changed
          - daily_policy_output_update.name == policy_name_daily

    - name: Create a weekly VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_weekly }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Weekly"
        instant_recovery_snapshot_retention: 5
        weekly_retention_count: 4
        schedule_days:
          - "Monday"
          - "Wednesday"
          - "Friday"
        time_zone: "Pacific Standard Time"
        schedule_run_time: 8
      register: weekly_policy_output

    - name: Assert success on weekly backup policy creation
      ansible.builtin.assert:
        that:
          - weekly_policy_output is changed
          - weekly_policy_output.name == policy_name_weekly

    - name: Update weekly VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_weekly }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Weekly"
        instant_recovery_snapshot_retention: 5
        weekly_retention_count: 4
        schedule_days:
          - "Monday"
          - "Wednesday"
          - "Thursday"
        time_zone: "Pacific Standard Time"
        schedule_run_time: 10
      register: weekly_policy_output_update

    - name: Assert success on update of weekly policy
      ansible.builtin.assert:
        that:
          - weekly_policy_output_update is changed
          - weekly_policy_output_update.name == policy_name_weekly

    - name: Create a daily VM backup policy with monthly and yearly retention
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_long_term }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        schedule_run_time: 14
        monthly_retention_count: 12
        yearly_retention_count: 5
        retention_schedule_format_type: Weekly
        months_of_year:
          - January
        retention_schedule_weekly:
          days_of_the_week:
            - Sunday
          weeks_of_the_month:
            - Last
      register: long_term_policy_output

    - name: Read back the long-term retention policy
      azure.azcollection.azure_rm_backuppolicy_info:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_long_term }}"
        resource_group: "{{ resource_group }}-backuppolicy"
      register: long_term_policy_info

    - name: Assert monthly and yearly retention are set
      ansible.builtin.assert:
        that:
          - long_term_policy_output is changed
          - long_term_policy_info.properties.retention_policy.monthly_schedule.retention_duration.count == 12
          - long_term_policy_info.properties.retention_policy.monthly_schedule.retention_duration.duration_type == 'Months'
          - long_term_policy_info.properties.retention_policy.yearly_schedule.retention_duration.count == 5
          - long_term_policy_info.properties.retention_policy.yearly_schedule.retention_duration.duration_type == 'Years'
          - long_term_policy_info.properties.retention_policy.yearly_schedule.months_of_year == ['January']

    - name: Create the same long-term retention policy again (idempotent)
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_long_term }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        schedule_run_time: 14
        monthly_retention_count: 12
        yearly_retention_count: 5
        retention_schedule_format_type: Weekly
        months_of_year:
          - January
        retention_schedule_weekly:
          days_of_the_week:
            - Sunday
          weeks_of_the_month:
            - Last
      register: long_term_policy_output_idempotent

    - name: Assert idempotency for long-term retention policy
      ansible.builtin.assert:
        that:
          - long_term_policy_output_idempotent is not changed

    - name: Create a daily VM backup policy with monthly retention using the Daily format
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_monthly_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        schedule_run_time: 14
        monthly_retention_count: 6
        retention_schedule_format_type: Daily
        retention_schedule_daily:
          days_of_the_month:
            - date: 1
              is_last: false
            - date: 0
              is_last: true
      register: monthly_daily_policy_output

    - name: Read back the monthly-daily retention policy
      azure.azcollection.azure_rm_backuppolicy_info:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_monthly_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
      register: monthly_daily_policy_info

    - name: Assert monthly retention with Daily format is set
      ansible.builtin.assert:
        that:
          - monthly_daily_policy_output is changed
          - monthly_daily_policy_info.properties.retention_policy.monthly_schedule.retention_duration.count == 6
          - monthly_daily_policy_info.properties.retention_policy.monthly_schedule.retention_duration.duration_type == 'Months'
          - monthly_daily_policy_info.properties.retention_policy.monthly_schedule.retention_schedule_format_type == 'Daily'
          - monthly_daily_policy_info.properties.retention_policy.monthly_schedule.retention_schedule_daily.days_of_the_month | length == 2

    - name: Reject mutually-exclusive retention_schedule_daily + retention_schedule_weekly
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_monthly_daily }}-bad"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: present
        backup_management_type: "AzureIaasVM"
        schedule_run_frequency: "Daily"
        instant_recovery_snapshot_retention: 2
        daily_retention_count: 12
        schedule_run_time: 14
        monthly_retention_count: 6
        retention_schedule_format_type: Daily
        retention_schedule_daily:
          days_of_the_month:
            - date: 1
              is_last: false
        retention_schedule_weekly:
          days_of_the_week:
            - Sunday
          weeks_of_the_month:
            - Last
      register: bad_policy_output
      ignore_errors: true

    - name: Assert mutually-exclusive validation fired
      ansible.builtin.assert:
        that:
          - bad_policy_output is failed
          - "'mutually exclusive' in bad_policy_output.msg"

    - name: Delete a daily VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: daily_policy_output_delete

    - name: Assert success on daily backup policy deletion
      ansible.builtin.assert:
        that:
          - daily_policy_output_delete is changed

    - name: Delete a daily VM enhanced backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: daily_policy_output_enhanced_delete

    - name: Assert success on daily enhanced backup policy deletion
      ansible.builtin.assert:
        that:
          - daily_policy_output_enhanced_delete is changed

    - name: Delete a weekly VM backup policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_weekly }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: weekly_policy_output_delete

    - name: Assert success on weekly backup policy deletion
      ansible.builtin.assert:
        that:
          - weekly_policy_output_delete is changed

    - name: Delete a daily VM backup policy (idempotent)
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: daily_policy_output_delete_idempotent

    - name: Assert that there is no change after second deletion of daily backup policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_delete_idempotent is not changed

    - name: Delete a daily VM enhanced backup policy (idempotent)
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_daily_enhanced }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: daily_policy_output_enhanced_delete_idempotent

    - name: Assert that there is no change after second deletion of daily enhanced backup policy
      ansible.builtin.assert:
        that:
          - daily_policy_output_enhanced_delete_idempotent is not changed

    - name: Delete a weekly VM backup policy (idempotent)
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_weekly }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: weekly_policy_output_delete_idempotent

    - name: Assert that there is no change after second deletion of weekly backup policy
      ansible.builtin.assert:
        that:
          - weekly_policy_output_delete_idempotent is not changed

    - name: Delete the long-term retention policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_long_term }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: long_term_policy_output_delete

    - name: Assert success on long-term retention policy deletion
      ansible.builtin.assert:
        that:
          - long_term_policy_output_delete is changed

    - name: Delete the monthly-daily retention policy
      azure.azcollection.azure_rm_backuppolicy:
        vault_name: "{{ vault_name }}"
        name: "{{ policy_name_monthly_daily }}"
        resource_group: "{{ resource_group }}-backuppolicy"
        state: absent
      register: monthly_daily_policy_output_delete

    - name: Assert success on monthly-daily retention policy deletion
      ansible.builtin.assert:
        that:
          - monthly_daily_policy_output_delete is changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-backuppolicy"
        force_delete_nonempty: true
        state: absent
