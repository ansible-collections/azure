- name: Create a new resource group for network watcher test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-networkwatcher"
    location: eastus

- name: For network watcher test
  block:
    - name: Set Random Variables
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(20, True, '') }}"

    - name: Create a Network Watcher(Checkmode test)
      azure.azcollection.azure_rm_networkwatcher:
        resource_group: "{{ resource_group }}-networkwatcher"
        name: "mynetwacher{{ rpfx }}"
        location: westus3
        tags:
          testing: testing
          delete: on-exit
      check_mode: true

    - name: Create a new Network Watcher
      azure.azcollection.azure_rm_networkwatcher:
        resource_group: "{{ resource_group }}-networkwatcher"
        name: "mynetwacher{{ rpfx }}"
        location: westus3
        tags:
          testing: testing
          delete: on-exit
      register: output

    - name: Assert the network watcher is well created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a Network Watcher again(Idempotent test)
      azure.azcollection.azure_rm_networkwatcher:
        resource_group: "{{ resource_group }}-networkwatcher"
        name: "mynetwacher{{ rpfx }}"
        location: westus3
        tags:
          testing: testing
          delete: on-exit
      register: output

    - name: Assert the network watcher is no change
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Get the network watcher facts
      azure.azcollection.azure_rm_networkwatcher_info:
        resource_group: "{{ resource_group }}-networkwatcher"
        name: "mynetwacher{{ rpfx }}"
      register: output

    - name: Assert the network wacher facts
      ansible.builtin.assert:
        that:
          - output.network_watchers[0].tags | length == 2

    - name: Get the network watcher facts and filter by tags
      azure.azcollection.azure_rm_networkwatcher_info:
        resource_group: "{{ resource_group }}-networkwatcher"
        tags:
          - none-key
      register: output

    - name: Assert the network wacher facts
      ansible.builtin.assert:
        that:
          - output.network_watchers[0] == None

    - name: Delete the Network Watcher
      azure.azcollection.azure_rm_networkwatcher:
        resource_group: "{{ resource_group }}-networkwatcher"
        name: "mynetwacher{{ rpfx }}"
        state: absent
      register: output

    - name: Assert the network watcher is well delete
      ansible.builtin.assert:
        that:
          - output is changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-networkwatcher"
        force_delete_nonempty: true
        state: absent
