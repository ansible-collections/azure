- name: Create a new resource group for public IP test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-publicip"
    location: eastus

- name: For public IP test
  block:
    - name: Create domain name
      ansible.builtin.set_fact:
        domain_name: "ansible-{{ resource_group | hash('md5') | truncate(24, True, '') }}"
        rpfx: "{{ resource_group | hash('md5') | truncate(9, True, '') }}{{ 1000 | random }}"

    - name: Remove public ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        state: absent

    - name: Create public ip prefix
      azure.azcollection.azure_rm_publicipprefix:
        resource_group: "{{ resource_group }}-publicip"
        name: "prefix{{ rpfx }}"
        zones:
          - 1
        public_ip_address_version: IPV4
        prefix_length: 29
        sku:
          name: Standard
          tier: Regional
      register: output

    - name: Create the first public ip with public_ip_prefix
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}-first"
        allocation_method: Static
        public_ip_prefix:
          id: "{{ output.state.id }}"
        sku: Standard
        domain_name: "{{ domain_name }}-first"
      register: output

    - name: Get the first public ip
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}-first"
      register: output

    - name: Assert the public ip facts
      ansible.builtin.assert:
        that:
          - output.publicipaddresses[0].public_ip_prefix.id is defined

    - name: Create public ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        allocation_method: Static
        sku: Standard
        domain_name: "{{ domain_name }}"
        reverse_fqdn: "{{ output.state.dns_settings.fqdn }}"
        tags:
          testing: testing
          delete: on-exit
      register: output

    - name: Assert the public ip created
      ansible.builtin.assert:
        that:
          - output.state.public_ip_allocation_method == 'static'
          - output.state.dns_settings.domain_name_label == domain_name
          - output.state.tags | length == 2
          - output.state.tags.testing == 'testing'

    - name: Create public ip with IPV6
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}-02"
        allocation_method: Static
        domain_name: "{{ domain_name }}-02"
        version: 'ipv6'
        sku: 'Standard'
        zones:
          - 1
      register: output

    - name: Assert the public ip created
      ansible.builtin.assert:
        that:
          - output.state.public_ip_address_version == 'ipv6'
          - output.state.zones == ['1']

    - name: Should be idempotent
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        sku: 'Standard'
        allocation_method: static
        domain_name: "{{ domain_name }}"
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Update tags
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        allocation_method: static
        sku: 'Standard'
        domain_name: "{{ domain_name }}"
        append_tags: true
        tags:
          delete: never
          foo: bar
      register: output

    - name: Assert the public ip address updated
      ansible.builtin.assert:
        that:
          - output.state.tags | length == 3
          - output.state.tags.delete == 'never'

    - name: Gather facts, filtering by tag
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}-publicip"
        tags:
          - testing
          - foo:bar
      register: infos

    - name: Assert the public ip address facts
      ansible.builtin.assert:
        that: infos.publicipaddresses | length == 1

    - name: Purge all tags
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        sku: 'Standard'
        allocation_method: static
        domain_name: "{{ domain_name }}"
        append_tags: false
      register: output

    - name: Assert purge all tags
      ansible.builtin.assert:
        that:
          - output.state.tags | length == 0

    - name: Gather facts for a public ip
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
      register: pip

    - name: Assert the public ip address facts
      ansible.builtin.assert:
        that:
          - pip.publicipaddresses | length == 1
          - pip.publicipaddresses[0].name == "pip" ~ rpfx
          - pip.publicipaddresses[0].allocation_method == 'static'
          - pip.publicipaddresses[0].dns_settings.domain_name_label == domain_name

    - name: Gather facts for all public ips
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}-publicip"
      register: infos

    - name: Assert all public ips
      ansible.builtin.assert:
        that: infos.publicipaddresses | length > 0

    - name: Remove IPV6 public ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}-02"
        state: absent

    - name: Remove the first public ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}-first"
        state: absent

    - name: Remove the public ip prefix
      azure.azcollection.azure_rm_publicipprefix:
        resource_group: "{{ resource_group }}-publicip"
        name: "prefix{{ rpfx }}"
        state: absent

    - name: Remove public ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
        state: absent

    - name: Gather facts for a public ip
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}-publicip"
        name: "pip{{ rpfx }}"
      register: infos

    - name: Assert public ip address facts
      ansible.builtin.assert:
        that: infos.publicipaddresses | length == 0
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-publicip"
        force_delete_nonempty: true
        state: absent
