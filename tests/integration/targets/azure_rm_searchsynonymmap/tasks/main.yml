- name: Create a resource group for the search synonym map test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-searchsm"
    location: eastus

- name: Run search synonym map tests
  block:
    - name: Build a unique search service name
      ansible.builtin.set_fact:
        svc_name: "searchsm{{ resource_group | hash('md5') | truncate(14, True, '') }}"

    - name: Create AI Search service
      azure.azcollection.azure_rm_cognitivesearch:
        resource_group: "{{ resource_group }}-searchsm"
        name: "{{ svc_name }}"
        sku: basic
      register: svc

    # Data-plane RBAC is off by default on a new search service (API-key only),
    # so enable AAD auth and grant the test principal a data-plane role. This
    # is what exercises the https://search.azure.com/.default token path.
    - name: Enable AAD (RBAC) data-plane auth on the search service
      azure.azcollection.azure_rm_resource:
        api_version: '2023-11-01'
        resource_group: "{{ resource_group }}-searchsm"
        provider: search
        resource_type: searchservices
        resource_name: "{{ svc_name }}"
        method: PATCH
        body:
          properties:
            authOptions:
              aadOrApiKey:
                aadAuthFailureMode: http403

    - name: Resolve the test service principal object id
      azure.azcollection.azure_rm_adserviceprincipal_info:
        app_id: "{{ azure_client_id }}"
      register: sp_info

    - name: Grant Search Service Contributor to the test principal
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ svc.state.id }}"
        assignee_object_id: "{{ sp_info.service_principals[0].object_id }}"
        # Search Service Contributor: manage data-plane object definitions
        # (indexes, data sources, indexers, skillsets, synonym maps).
        # https://learn.microsoft.com/en-us/azure/search/search-security-rbac
        role_definition_id: "/subscriptions/{{ azure_subscription_id }}/providers/Microsoft.Authorization/roleDefinitions/7ca78c08-252a-4471-8644-bb5ff32d4ba0"
        state: present

    # A synonym map is self-contained: just Solr-format synonym rules, no
    # storage account, cognitive services, or other secrets.
    - name: Create synonym map (check mode)
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        synonyms: |-
          USA, United States, United States of America
          UK, United Kingdom
      check_mode: true
      register: sm_check
      # Absorb AAD auth-option and role-assignment propagation (can take minutes).
      retries: 20
      delay: 15
      until: sm_check is not failed

    - name: Assert check mode reports change without creating
      ansible.builtin.assert:
        that:
          - sm_check.changed

    - name: Create synonym map
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        synonyms: |-
          USA, United States, United States of America
          UK, United Kingdom
      register: sm_create

    - name: Assert created (RBAC data-plane scope worked)
      ansible.builtin.assert:
        that:
          - sm_create.changed
          - sm_create.state.name == 'it-synonyms'
          - sm_create.state.format == 'solr'

    - name: Create synonym map again (idempotent)
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        synonyms: |-
          USA, United States, United States of America
          UK, United Kingdom
      register: sm_idem

    - name: Assert no change on second run
      ansible.builtin.assert:
        that:
          - not sm_idem.changed

    - name: Get synonym map via info
      azure.azcollection.azure_rm_searchsynonymmap_info:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
      register: sm_info

    - name: Assert info returns the synonym map
      ansible.builtin.assert:
        that:
          - sm_info.synonymmaps | length == 1
          - sm_info.synonymmaps[0].name == 'it-synonyms'

    - name: Update the synonym map (add a rule)
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        synonyms: |-
          USA, United States, United States of America
          UK, United Kingdom
          GB, Great Britain
      register: sm_update

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - sm_update.changed

    - name: Update the synonym map again (idempotent)
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        synonyms: |-
          USA, United States, United States of America
          UK, United Kingdom
          GB, Great Britain
      register: sm_update_idem

    - name: Assert no change on repeated update
      ansible.builtin.assert:
        that:
          - not sm_update_idem.changed

    - name: Info for a non-existent synonym map returns empty
      azure.azcollection.azure_rm_searchsynonymmap_info:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: does-not-exist
      register: sm_missing

    - name: Assert empty list, not failure
      ansible.builtin.assert:
        that:
          - sm_missing.synonymmaps | length == 0

    - name: Delete synonym map
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        state: absent
      register: sm_delete

    - name: Assert deleted
      ansible.builtin.assert:
        that:
          - sm_delete.changed

    - name: Delete synonym map again (idempotent absent)
      azure.azcollection.azure_rm_searchsynonymmap:
        resource_group: "{{ resource_group }}-searchsm"
        search_service_name: "{{ svc_name }}"
        name: it-synonyms
        state: absent
      register: sm_delete_idem

    - name: Assert no change on second delete
      ansible.builtin.assert:
        that:
          - not sm_delete_idem.changed

  always:
    - name: Clean up search service
      azure.azcollection.azure_rm_cognitivesearch:
        resource_group: "{{ resource_group }}-searchsm"
        name: "{{ svc_name }}"
        state: absent
      ignore_errors: true

    - name: Clean up resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-searchsm"
        location: eastus
        state: absent
        force_delete_nonempty: true
      ignore_errors: true
