- name: Create resource group for Cosmos MongoDB collection tests
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-cosmosmongo"
    location: eastus

- name: Exercise MongoDB collection management
  block:
    - name: Set test names
      ansible.builtin.set_fact:
        mongo_rg: "{{ resource_group }}-cosmosmongo"
        mongo_account: "mg{{ resource_group | hash('md5') | truncate(16, true, '') }}"
        mongo_api_version: '2024-02-15-preview'

    - name: Create MongoDB Cosmos DB account
      azure.azcollection.azure_rm_cosmosdbaccount:
        resource_group: "{{ mongo_rg }}"
        name: "{{ mongo_account }}"
        location: eastus
        kind: mongo_db
        database_account_offer_type: Standard
        geo_rep_locations:
          - name: eastus
            failover_priority: 0
      register: account

    - name: Create Mongo database
      azure.azcollection.azure_rm_resource:
        url: "{{ account.id }}/mongoDBDatabases/testdb"
        api_version: "{{ mongo_api_version }}"
        method: PUT
        body:
          properties:
            resource:
              id: testdb
        polling_timeout: 900

    - name: Set collection URL
      ansible.builtin.set_fact:
        collection_url: "{{ account.id }}/mongoDBDatabases/testdb/collections/events"

    - name: Predict collection creation
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        shard_key:
          tenantId: Hash
        indexes:
          - keys: [_id]
            unique: true
        throughput: 400
      check_mode: true
      register: collection_check

    - name: Independently verify check mode did not create the collection
      azure.azcollection.azure_rm_resource_info:
        url: "{{ collection_url }}"
        api_version: "{{ mongo_api_version }}"
      register: before_create

    - name: Assert predicted collection creation
      ansible.builtin.assert:
        that:
          - collection_check is changed
          - before_create.status_code == 404

    - name: Create MongoDB collection
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        shard_key:
          tenantId: Hash
        indexes:
          - keys: [_id]
            unique: true
        throughput: 400
      register: collection_create

    - name: Verify collection independently
      azure.azcollection.azure_rm_resource_info:
        url: "{{ collection_url }}"
        api_version: "{{ mongo_api_version }}"
      register: after_create

    - name: Assert collection properties
      ansible.builtin.assert:
        that:
          - collection_create is changed
          - after_create.response[0].properties.resource.shardKey.tenantId == 'Hash'
          - after_create.response[0].properties.resource.indexes | length == 1

    - name: Assert collection idempotency
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        shard_key:
          tenantId: Hash
        indexes:
          - keys: [_id]
            unique: true
        throughput: 400
      register: collection_idempotent

    - name: Assert unchanged collection
      ansible.builtin.assert:
        that:
          - collection_idempotent is not changed

    - name: Update collection indexes and scale manual throughput
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        indexes:
          - keys: [_id]
            unique: true
          - keys: [tenantId]
        throughput: 800
      register: collection_update

    - name: Verify updated indexes and throughput independently
      azure.azcollection.azure_rm_resource_info:
        url: "{{ collection_url }}"
        api_version: "{{ mongo_api_version }}"
      register: after_update

    - name: Verify updated throughput independently
      azure.azcollection.azure_rm_resource_info:
        url: "{{ collection_url }}/throughputSettings/default"
        api_version: "{{ mongo_api_version }}"
      register: throughput_info

    - name: Assert updated collection values
      ansible.builtin.assert:
        that:
          - collection_update is changed
          - after_update.response[0].properties.resource.indexes | length == 2
          - throughput_info.response[0].properties.resource.throughput == 800

    - name: Predict collection deletion
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        state: absent
      check_mode: true
      register: delete_check

    - name: Assert delete check mode leaves collection in place
      ansible.builtin.assert:
        that:
          - delete_check is changed
          - after_update.response | length == 1

    - name: Delete MongoDB collection
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        state: absent
      register: collection_delete

    - name: Assert collection deleted
      ansible.builtin.assert:
        that:
          - collection_delete is changed

    - name: Repeat delete for idempotency
      azure.azcollection.azure_rm_cosmosdbmongocollection:
        resource_group: "{{ mongo_rg }}"
        account_name: "{{ mongo_account }}"
        database_name: testdb
        name: events
        state: absent
      register: delete_repeat

    - name: Assert delete idempotency
      ansible.builtin.assert:
        that:
          - delete_repeat is not changed

  always:
    - name: Delete test resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-cosmosmongo"
        state: absent
        force_delete_nonempty: true
