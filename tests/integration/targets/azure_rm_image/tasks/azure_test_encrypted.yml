- name: Set up disk encryption sets
  ansible.builtin.include_tasks: setup_des.yml

- name: Create an image from VM (check mode)
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    source: "{{ vm.ansible_facts.azure_vm.storage_profile.os_disk.managed_disk.id }}"
    name: testimage001
    os_type: Linux
    os_disk_encryption_set: "{{ des_results.state.id }}"
    data_disk_encryption_set: "{{ des_results.state.id }}"
    hyper_v_generation: V1
    data_disk_sources:
      - "{{ empty_disk_name }}"
  check_mode: true
  register: output

- name: Assert the image check mode
  ansible.builtin.assert:
    that: output is changed

- name: Create an image from VM
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    source:
      name: "{{ vm_name }}"
      type: disks
    name: testimage001
    hyper_v_generation: V1
    os_type: Linux
    os_disk_encryption_set: "{{ des_results.state.id }}"
    data_disk_encryption_set: "{{ des_results.state.id }}"
  register: output

- name: Assert the image created
  ansible.builtin.assert:
    that:
      - output is changed
      - output.id is defined

- name: Create an image from VM (idempotent)
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    source: "{{ vm.ansible_facts.azure_vm.storage_profile.os_disk.managed_disk.id }}"
    name: testimage001
    hyper_v_generation: V1
    os_type: Linux
    os_disk_encryption_set: "{{ des_results.state.id }}"
    data_disk_encryption_set: "{{ des_results.state.id }}"
  register: output

- name: Assert the image created
  ansible.builtin.assert:
    that:
      - output is not changed
      - output.id is defined

- name: Gather information about image created
  azure.azcollection.azure_rm_image_info:
    resource_group: "{{ resource_group }}-image"
    name: testimage001
  register: output

- name: Assert the image facts
  ansible.builtin.assert:
    that:
      - output.images != []
      - output.images[0].hyper_v_generation == 'V1'

- name: Delete image (check mode)
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    name: testimage001
    state: absent
  register: output
  check_mode: true

- name: Assert the image check mode
  ansible.builtin.assert:
    that:
      - output is changed

- name: Delete image
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    name: testimage001
    state: absent
  register: output

- name: Assert the imaged deleted
  ansible.builtin.assert:
    that:
      - output is changed

- name: Delete image (idempotent)
  azure.azcollection.azure_rm_image:
    resource_group: "{{ resource_group }}-image"
    name: testimage001
    state: absent
  register: output

- name: Assert the image has deleted
  ansible.builtin.assert:
    that:
      - output is not changed

- name: Destroy disk encryption set
  azure.azcollection.azure_rm_diskencryptionset:
    resource_group: "{{ resource_group }}-image"
    name: "{{ des_name }}"
    state: absent

- name: Destroy key vault
  azure.azcollection.azure_rm_keyvault:
    vault_name: "{{ vault_name }}"
    resource_group: "{{ resource_group }}-image"
    state: absent
