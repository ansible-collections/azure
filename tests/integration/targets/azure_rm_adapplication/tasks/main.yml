- name: Set display name variable
  ansible.builtin.set_fact:
    display_name: "test_app_{{ 999999999999999999994 | random | to_uuid }}"
    password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', 'punctuation'], length=13) }}"
  run_once: true

- name: Get full list from ad app info
  azure.azcollection.azure_rm_adapplication_info:
  register: app_info_output

- name: Create application
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}"
  register: create_output

- name: Assert create successfully
  ansible.builtin.assert:
    that: create_output is changed

- name: Create application by app_id again idempotent test
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ create_output.app_id }}"
    display_name: "{{ display_name }}"
  register: output_app_id

- name: Assert application by app_id the idempotent success
  ansible.builtin.assert:
    that: output_app_id is not changed

- name: Create application with more parameters
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}"
    app_id: "{{ create_output.app_id }}"
    homepage: "https://{{ display_name }}.test.com"
    sign_in_audience: AzureADMultipleOrgs
    identifier_uris:
      - "{{ display_name }}.com"
    app_roles:
      - allowed_member_types:
          - User
        description: "for app role test"
        display_name: "{{ display_name }}_approle"
        is_enabled: true
        value: "{{ password }}"
    optional_claims:
      access_token_claims:
        - name: aud
          essential: true
      id_token_claims:
        - name: acct
          essential: true
      saml2_token_claims:
        - name: acct
          essential: true
  register: second_output

- name: Assert secondary resource create success
  ansible.builtin.assert:
    that: second_output is changed

- name: Get ad app info by object id
  azure.azcollection.azure_rm_adapplication_info:
    object_id: "{{ create_output.object_id }}"
  register: object_id_output

- name: Get ad app info by app id
  azure.azcollection.azure_rm_adapplication_info:
    app_id: "{{ create_output.app_id }}"
  register: app_id_output

- name: Get ad app info by display name
  azure.azcollection.azure_rm_adapplication_info:
    app_display_name: "{{ display_name }}"
  register: display_name_output

- name: Assert the application facts
  ansible.builtin.assert:
    that:
      - object_id_output.applications[0].app_display_name == "{{ display_name }}"
      - object_id_output.applications | length == 1
      - app_id_output.applications[0].app_display_name == "{{ display_name }}"
      - app_id_output.applications | length == 1
      - display_name_output.applications[0].app_display_name == "{{ display_name }}"
      - display_name_output.applications | length == 1

- name: Get difference from app_info_output and current
  azure.azcollection.azure_rm_adapplication_info:
    app_diff: "{{ app_info_output.applications }}"
  register: diff_output

- name: Assert the difference
  ansible.builtin.assert:
    that: diff_output.app_diff[0].app_display_name == "{{ display_name }}"

- name: Generate test RSA private key (PEM)
  ansible.builtin.command:
    cmd: >
      openssl genrsa -out "{{ playbook_dir }}/testcert.key" 2048
  args:
    creates: "{{ playbook_dir }}/testcert.key"

- name: Generate self-signed certificate (PEM)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes -key "{{ playbook_dir }}/testcert.key"
      -sha256 -days 365 -subj "/CN=ansible-test" -out "{{ playbook_dir }}/testcert.crt"
  args:
    creates: "{{ playbook_dir }}/testcert.crt"

- name: Convert PEM to DER
  ansible.builtin.command:
    cmd: >
      openssl x509 -in {{ playbook_dir }}/testcert.crt -outform DER -out {{ playbook_dir }}/testcert.cer
  args:
    creates: "{{ playbook_dir }}/testcert.cer"

- name: Slurp DER certificate
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/testcert.cer"
  register: cert_file

- name: Create application with certificate key_value
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}_cert"
    key_type: AsymmetricX509Cert
    key_usage: Verify
    key_value: "{{ cert_file.content }}"
    key_display_name: "ansible-integration-test-cert"
  register: cert_app_output

- name: Assert certificate app created successfully
  ansible.builtin.assert:
    that:
      - cert_app_output is changed
      - cert_app_output.object_id is defined
      - cert_app_output.key_credentials | length == 1
      - cert_app_output.key_credentials[0].display_name == "ansible-integration-test-cert"
      - cert_app_output.key_credentials[0].type == "AsymmetricX509Cert"
      - cert_app_output.key_credentials[0].usage == "Verify"
      - cert_app_output.generated_password_credentials | default([]) | length == 0

- name: Create application requesting a generated client secret
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}_secret"
    request_password: true
    password_display_name: "ansible-integration-test"
  register: secret_app_output
  no_log: true

- name: Assert generated secret is returned
  ansible.builtin.assert:
    that:
      - secret_app_output is changed
      - secret_app_output.object_id is defined
      - secret_app_output.password_credentials | length == 1
      - secret_app_output.password_credentials[0].display_name == "ansible-integration-test"
      - secret_app_output.password_credentials[0].key_id is defined
      - secret_app_output.generated_password_credentials | length == 1
      - secret_app_output.generated_password_credentials[0].secret_text | length >= 16
      - secret_app_output.generated_password_credentials[0].key_id == secret_app_output.password_credentials[0].key_id

- name: Re-run secret application creation (idempotency)
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ secret_app_output.app_id }}"
    display_name: "{{ display_name }}_secret"
    request_password: true
    password_display_name: "ansible-integration-test"
  register: secret_app_rerun
  no_log: true

- name: Assert idempotent re-run did not create a new secret
  ansible.builtin.assert:
    that:
      - secret_app_rerun is not changed
      - secret_app_rerun.generated_password_credentials | default([]) | length == 0

- name: Legacy password=<value> still works but emits deprecation warning
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}_legacy"
    password: "{{ password }}"
    password_display_name: "ansible-integration-test-legacy"
  register: legacy_app_output
  no_log: true

- name: Assert legacy path produced a server-generated secret and a deprecation warning
  ansible.builtin.assert:
    that:
      - legacy_app_output is changed
      - legacy_app_output.generated_password_credentials | length == 1
      - legacy_app_output.generated_password_credentials[0].secret_text | length >= 16
      - legacy_app_output.deprecations | default([]) | selectattr('msg', 'search', "azure_rm_adapplication") | list | length >= 1

- name: Mutually exclusive request_password + key_value must fail
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ display_name }}_conflict"
    request_password: true
    key_value: "{{ cert_file.content }}"
  register: conflict_output
  ignore_errors: true

- name: Assert mutual-exclusion error was raised
  ansible.builtin.assert:
    that:
      - conflict_output is failed
      - "'specify either a password credential' in conflict_output.msg"

- name: Delete legacy-password application
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ legacy_app_output.app_id }}"
    display_name: "{{ display_name }}_legacy"
    state: absent

- name: Delete generated-secret application
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ secret_app_output.app_id }}"
    display_name: "{{ display_name }}_secret"
    state: absent

- name: Delete certificate application
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ cert_app_output.app_id }}"
    display_name: "{{ display_name }}_cert"
    state: absent

- name: Delete ad app by app_id
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ create_output.app_id }}"
    display_name: "{{ display_name }}"
    state: absent
  register: output

- name: Assert the application delete success
  ansible.builtin.assert:
    that: output is changed

- name: Delete ad app by app id again
  azure.azcollection.azure_rm_adapplication:
    app_id: "{{ second_output.app_id }}"
    display_name: "{{ display_name }}"
    state: absent
  register: output

- name: Assert the secondary application delete no changed
  ansible.builtin.assert:
    that: output is not changed

- name: Get ad app info by app id
  azure.azcollection.azure_rm_adapplication_info:
    app_id: "{{ create_output.app_id }}"
  register: output

- name: Assert there is no application
  ansible.builtin.assert:
    that:
      - output.applications | length == 0
