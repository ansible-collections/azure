- name: Create a resource group for the search datasource test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-searchds"
    location: eastus

- name: Run search datasource tests
  block:
    - name: Build unique names
      ansible.builtin.set_fact:
        svc_name: "searchds{{ resource_group | hash('md5') | truncate(14, True, '') }}"
        sa_name: "sads{{ resource_group | hash('md5') | truncate(20, True, '') }}"

    - name: Create AI Search service
      azure.azcollection.azure_rm_cognitivesearch:
        resource_group: "{{ resource_group }}-searchds"
        name: "{{ svc_name }}"
        sku: basic
      register: svc

    # Data-plane RBAC is off by default on a new search service (API-key only),
    # so enable AAD auth and grant the test principal a data-plane role. This
    # is what exercises the https://search.azure.com/.default token path.
    - name: Enable AAD (RBAC) data-plane auth on the search service
      azure.azcollection.azure_rm_resource:
        api_version: '2023-11-01'
        resource_group: "{{ resource_group }}-searchds"
        provider: search
        resource_type: searchservices
        resource_name: "{{ svc_name }}"
        method: PATCH
        body:
          properties:
            authOptions:
              aadOrApiKey:
                aadAuthFailureMode: http403

    - name: Resolve the test service principal object id
      azure.azcollection.azure_rm_adserviceprincipal_info:
        app_id: "{{ azure_client_id }}"
      register: sp_info

    - name: Grant Search Service Contributor to the test principal
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ svc.state.id }}"
        assignee_object_id: "{{ sp_info.service_principals[0].object_id }}"
        # Search Service Contributor: manage data-plane object definitions
        # (indexes, data sources, indexers, skillsets).
        # https://learn.microsoft.com/en-us/azure/search/search-security-rbac
        role_definition_id: "/subscriptions/{{ azure_subscription_id }}/providers/Microsoft.Authorization/roleDefinitions/7ca78c08-252a-4471-8644-bb5ff32d4ba0"
        state: present

    # A blob data source connection is validated by Azure at create time, so
    # stand up a real storage account + container for it to point at.
    - name: Create storage account for the data source
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-searchds"
        name: "{{ sa_name }}"
        account_type: Standard_LRS
        kind: StorageV2

    - name: Create a blob container
      azure.azcollection.azure_rm_storageblob:
        resource_group: "{{ resource_group }}-searchds"
        account_name: "{{ sa_name }}"
        container_name: documents

    - name: Get the storage account connection string
      azure.azcollection.azure_rm_storageaccount_info:
        resource_group: "{{ resource_group }}-searchds"
        name: "{{ sa_name }}"
        show_connection_string: true
      register: sa_info

    - name: Set connection string fact
      ansible.builtin.set_fact:
        ds_connection_string: "{{ sa_info.storageaccounts[0].primary_endpoints.blob.connectionstring }}"

    - name: Create data source (check mode)
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        type: azureblob
        connection_string: "{{ ds_connection_string }}"
        container:
          name: documents
      check_mode: true
      register: ds_check
      # Absorb AAD auth-option and role-assignment propagation (can take minutes).
      retries: 20
      delay: 15
      until: ds_check is not failed

    - name: Assert check mode reports change without creating
      ansible.builtin.assert:
        that:
          - ds_check.changed

    - name: Create data source
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        type: azureblob
        connection_string: "{{ ds_connection_string }}"
        container:
          name: documents
      register: ds_create

    - name: Assert created (RBAC data-plane scope worked)
      ansible.builtin.assert:
        that:
          - ds_create.changed
          - ds_create.state.name == 'it-ds'
          - ds_create.state.type == 'azureblob'

    - name: Create data source again (idempotent)
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        type: azureblob
        connection_string: "{{ ds_connection_string }}"
        container:
          name: documents
      register: ds_idem

    - name: Assert no change on second run (credentials redaction ignored)
      ansible.builtin.assert:
        that:
          - not ds_idem.changed

    - name: Get data source via info
      azure.azcollection.azure_rm_searchdatasource_info:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
      register: ds_info

    - name: Assert info returns the data source
      ansible.builtin.assert:
        that:
          - ds_info.datasources | length == 1
          - ds_info.datasources[0].name == 'it-ds'

    # Change ONLY the description, omitting type, connection_string and
    # container. create_or_update is a full-replace PUT, so this verifies the
    # module carries forward the container (and preserves the connection string
    # via the <unchanged> sentinel) instead of dropping them.
    - name: Update the data source (description only)
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        description: Knowledge base documents
      register: ds_update

    - name: Assert update changed and preserved other fields
      ansible.builtin.assert:
        that:
          - ds_update.changed
          - ds_update.state.description == 'Knowledge base documents'
          - ds_update.state.type == 'azureblob'
          - ds_update.state.container.name == 'documents'

    - name: Update the data source again (idempotent)
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        description: Knowledge base documents
      register: ds_update_idem

    - name: Assert no change on repeated description-only update
      ansible.builtin.assert:
        that:
          - not ds_update_idem.changed

    - name: Info for a non-existent data source returns empty
      azure.azcollection.azure_rm_searchdatasource_info:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: does-not-exist
      register: ds_missing

    - name: Assert empty list, not failure
      ansible.builtin.assert:
        that:
          - ds_missing.datasources | length == 0

    - name: Delete data source
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        state: absent
      register: ds_delete

    - name: Assert deleted
      ansible.builtin.assert:
        that:
          - ds_delete.changed

    - name: Delete data source again (idempotent absent)
      azure.azcollection.azure_rm_searchdatasource:
        resource_group: "{{ resource_group }}-searchds"
        search_service_name: "{{ svc_name }}"
        name: it-ds
        state: absent
      register: ds_delete_idem

    - name: Assert no change on second delete
      ansible.builtin.assert:
        that:
          - not ds_delete_idem.changed

  always:
    - name: Clean up search service
      azure.azcollection.azure_rm_cognitivesearch:
        resource_group: "{{ resource_group }}-searchds"
        name: "{{ svc_name }}"
        state: absent
      ignore_errors: true

    - name: Clean up resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-searchds"
        location: eastus
        state: absent
        force_delete_nonempty: true
      ignore_errors: true
