- name: Create a new resource group for Azure Front Door ruleset test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-afdruleset"
    location: eastus

- name: For Azure Front Door ruleset test
  block:
    - name: Prepare random name for Profile & Ruleset
      ansible.builtin.set_fact:
        profile: "prof-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        ruleset: "ruleset{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        ruleset2: "ruleset2{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"

    - name: Create Standard Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        location: "Global"
        resource_group: "{{ resource_group }}-afdruleset"
        sku: "standard_azurefrontdoor"
        state: "present"

    - name: Create Ruleset
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "present"
      register: output

    - name: Assert the resource was created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Update Ruleset (idempotent test)
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "present"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Create Ruleset 2
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset2 }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "present"
      register: output

    - name: Assert the resource was created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Load info for all Rulesets
      azure.azcollection.azure_rm_afdruleset_info:
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
      register: output

    - name: Assert there are two resources
      ansible.builtin.assert:
        that:
          - output.afdrulesets | length == 2
          - output is not changed

    - name: Delete Origin Group 2
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset2 }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "absent"
      register: output

    - name: Assert the resource was deleted
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Load info for all Rulesets
      azure.azcollection.azure_rm_afdruleset_info:
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
      register: output

    - name: Assert the resource has the proper values set
      ansible.builtin.assert:
        that:
          - output.afdrulesets | length == 1
          - output.afdrulesets[0].name == "{{ ruleset }}"
          - output is not changed

    - name: Delete Ruleset
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "absent"
      register: output

    - name: Assert the resource was changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete Ruleset (idempotent test)
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "absent"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Delete Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdruleset"
        state: "absent"
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-afdruleset"
        force_delete_nonempty: true
        state: absent
