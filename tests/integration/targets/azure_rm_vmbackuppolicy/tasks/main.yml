- name: Create a new resource group for VM backup policy test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-vmbackuppolicy"
    location: eastus

- name: For VM backup policy test
  block:
    - name: Fix resource prefix
      ansible.builtin.set_fact:
        name_rpfx: "myPolicy{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        vault_name: "myVault"
        location: "eastus"

    - name: Create Azure Recovery Service vault
      azure.azcollection.azure_rm_recoveryservicesvault:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ name_rpfx }}"
        location: "{{ location }}"
        state: "present"
      register: vault

    - name: Create VM Backup Policy
      azure.azcollection.azure_rm_vmbackuppolicy:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ name_rpfx }}"
        vault_name: "{{ vault.response.name }}"
        state: "present"
      register: output

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create VM Backup Policy (idempotent)
      azure.azcollection.azure_rm_vmbackuppolicy:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ name_rpfx }}"
        vault_name: "{{ vault.response.name }}"
        state: "present"
      register: output

    - name: Assert that output has no changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Get VM Backup Policy Details
      azure.azcollection.azure_rm_vmbackuppolicy_info:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ name_rpfx }}"
        vault_name: "{{ vault.response.name }}"
      register: output

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - output.response.id != None
          - output.response.name != None

    - name: Delete VM Backup Policy
      azure.azcollection.azure_rm_vmbackuppolicy:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ name_rpfx }}"
        vault_name: "{{ vault.response.name }}"
        state: "absent"
      register: output

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete Azure Recovery Service vault
      azure.azcollection.azure_rm_recoveryservicesvault:
        resource_group: "{{ resource_group }}-vmbackuppolicy"
        name: "{{ vault.response.name }}"
        location: "{{ location }}"
        state: "absent"
      register: output

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - output is changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-vmbackuppolicy"
        force_delete_nonempty: true
        state: absent
