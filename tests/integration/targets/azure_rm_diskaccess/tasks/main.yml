- name: Create a new resource group for disk access test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-diskaccess"
    location: eastus

- name: For disk access test
  block:
    - name: Set varialbles
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(8, True, '') }}"

    - name: Create a new disk access (Checkmode Test)
      azure.azcollection.azure_rm_diskaccess:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
        location: westus
        tags:
          key1: value1
      check_mode: true

    - name: Create a new disk access
      azure.azcollection.azure_rm_diskaccess:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
        location: westus
        tags:
          key1: value1
      register: output

    - name: Assert the disk access created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new disk access(Idempotent Test)
      azure.azcollection.azure_rm_diskaccess:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
        location: westus
        tags:
          key1: value1
      register: output

    - name: Assert the disk access no change
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update the disk access
      azure.azcollection.azure_rm_diskaccess:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
        location: westus
        tags:
          key2: value2
      register: output

    - name: Assert the disk access updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the disk access facts
      azure.azcollection.azure_rm_diskaccess_info:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
      register: output

    - name: Assert the disk access facts
      ansible.builtin.assert:
        that:
          - output.disk_accesses[0].tags | length == 2

    - name: Delete the disk access
      azure.azcollection.azure_rm_diskaccess:
        resource_group: "{{ resource_group }}-diskaccess"
        name: 'test{{ rpfx }}'
        state: absent
      register: output

    - name: Assert the disk access deleted
      ansible.builtin.assert:
        that:
          - output is changed
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-diskaccess"
        force_delete_nonempty: true
        state: absent
