- name: Create a new resource group for api management test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-apimanagement"
    location: eastus

- name: For api management test
  block:
    - name: Fix resource prefix
      ansible.builtin.set_fact:
        api_id: "myPolicy{{ resource_group | hash('md5') | truncate(23, True, '') }}"
        service_name: "myService{{ resource_group | hash('md5') | truncate(22, True, '') }}"
        display_name: test-api
        path: myapipath

    - name: Create API management service
      azure.azcollection.azure_rm_apimanagementservice:
        resource_group: "{{ resource_group }}-apimanagement"
        name: "{{ service_name }}"
        publisher_email: user@example.com
        publisher_name: Username
        sku_name: Developer
        sku_capacity: 1

    - name: Pause for 60 minutes to create api management
      ansible.builtin.pause:
        minutes: 60
      changed_when: true

    - name: Create a new API instance
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
        description: "testDescription"
        display_name: "{{ display_name }}"
        service_url: 'http://testapi.example.net/api'
        path: "{{ path }}"
        protocols:
          - https
      register: newapi

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - newapi is changed
          - newapi is not failed

    - name: Create a new API instance Idempotent
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
        description: "testDescription"
        display_name: "{{ display_name }}"
        service_url: 'http://testapi.example.net/api'
        path: "{{ path }}"
        protocols:
          - https
      register: newapi_idempotent

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - newapi_idempotent is not changed
          - newapi_idempotent is not failed

    - name: Update protocols
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
        description: "testDescription"
        display_name: "{{ display_name }}"
        service_url: 'http://testapi.example.net/api'
        path: "{{ path }}"
        protocols:
          - https
          - http
      register: updateapi

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - updateapi is changed

    - name: Create different format api
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}-secondary"
        path: "{{ path }}-secondary"
        format: openapi
        display_name: "{{ display_name }}-secondary"
        protocols:
          - https
      register: newopenapi

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - newopenapi is changed
          - newopenapi is not failed

    - name: Get api information
      azure.azcollection.azure_rm_apimanagement_info:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
      register: output

    - name: Assert that output has changed
      ansible.builtin.assert:
        that:
          - output.api.id != None

    - name: Delete an api
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
        state: absent
      register: deleteapi

    - name: Assert the changes
      ansible.builtin.assert:
        that:
          - deleteapi is changed

    - name: Delete an api Idempotent
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}"
        state: absent
      register: deleteapi_idempotent

    - name: Assert the changes
      ansible.builtin.assert:
        that:
          - deleteapi_idempotent is not changed

    - name: Delete an api
      azure.azcollection.azure_rm_apimanagement:
        resource_group: "{{ resource_group }}-apimanagement"
        service_name: "{{ service_name }}"
        api_id: "{{ api_id }}-secondary"
        state: absent
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-apimanagement"
        force_delete_nonempty: true
        state: absent
