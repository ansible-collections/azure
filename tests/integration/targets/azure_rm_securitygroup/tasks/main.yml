- name: Create a new resource group for test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-{{ item }}"
    location: eastus
  loop:
    - securitygroup01
    - securitygroup02

- name: For test
  block:
    - name: Prepare random number
      ansible.builtin.set_fact:
        secgroupname: "sg{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
        asg_name1: "asg1{{ resource_group | hash('md5') | truncate(7, True, '') }}"
        asg_name2: "asg2{{ resource_group | hash('md5') | truncate(7, True, '') }}"
        sg_name1: "sgasg{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Create security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        tags:
          testing: testing
          delete: on-exit
          foo: bar
          testkey: testvalue
        purge_rules: true
        rules:
          - name: DenySSH
            protocol: Tcp
            destination_port_range: 22
            access: Deny
            priority: 100
            direction: Inbound
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range: 22
            access: Allow
            priority: 101
            direction: Inbound
      register: output
    - name: Assert resource created
      ansible.builtin.assert:
        that:
          - output.state.rules | length == 2

    - name: Gather facts by tags
      azure.azcollection.azure_rm_securitygroup_info:
        resource_group: "{{ resource_group }}-securitygroup01"
        tags:
          - testing
          - foo:bar
          - testkey
      register: output
    - name: Assert resource retrieved
      ansible.builtin.assert:
        that:
          - output.securitygroups | length == 1
          - output.securitygroups[0].default_rules | length > 0
          - output.securitygroups[0].name == secgroupname
          - output.securitygroups[0].network_interfaces | length == 0
          - output.securitygroups[0].rules | length == 2
          - output.securitygroups[0].subnets | length == 0

    - name: Add/Update rules on existing security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix: 174.108.158.0/24
            destination_port_range: 22
            access: Allow
            priority: 101
          - name: AllowSSHFromHome
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range: 22-23
            priority: 102
          - name: AllowHTTPandHTTPS
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range:
              - 80
              - 443
            priority: 103
      register: output
    - name: Assert resource updated
      ansible.builtin.assert:
        that:
          - output.state.rules | length== 4
          - output.state.rules[0].source_address_prefix == '174.108.158.0/24'

    - name: Gather facts after update
      azure.azcollection.azure_rm_securitygroup_info:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
      register: output
    - name: Assert rules updated
      ansible.builtin.assert:
        that:
          - output.securitygroups[0].rules | length == 4

    - name: Test idempotence
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix: 174.108.158.0/24
            destination_port_range: 22
            access: Allow
            priority: 101
          - name: AllowSSHFromHome
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range: 22-23
            priority: 102
          - name: AllowHTTPandHTTPS
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range:
              - 80
              - 443
            priority: 103
      register: output
    - name: Assert resource not updated
      ansible.builtin.assert:
        that: output is not changed

    - name: Add a rule with diff:true to exercise diff mode
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix: 174.108.158.0/24
            destination_port_range: 22
            access: Allow
            priority: 101
          - name: AllowSSHFromHome
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range: 22-23
            priority: 102
          - name: AllowHTTPandHTTPS
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range:
              - 80
              - 443
            priority: 103
          - name: DiffModeCanary
            protocol: Tcp
            source_address_prefix: 10.0.0.0/24
            destination_port_range: 8080
            access: Allow
            priority: 200
            direction: Inbound
      diff: true
      register: diff_output
    - name: Assert diff mode reports before/after delta
      ansible.builtin.assert:
        that:
          - diff_output is changed
          - diff_output.diff is defined
          - diff_output.diff.before is mapping
          - diff_output.diff.after is mapping
          - diff_output.diff.before.rules | length == 4
          - diff_output.diff.after.rules | length == 5

    - name: Re-run same rules with diff:true (idempotent)
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix: 174.108.158.0/24
            destination_port_range: 22
            access: Allow
            priority: 101
          - name: AllowSSHFromHome
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range: 22-23
            priority: 102
          - name: AllowHTTPandHTTPS
            protocol: Tcp
            source_address_prefix: 174.109.158.0/24
            destination_port_range:
              - 80
              - 443
            priority: 103
          - name: DiffModeCanary
            protocol: Tcp
            source_address_prefix: 10.0.0.0/24
            destination_port_range: 8080
            access: Allow
            priority: 200
            direction: Inbound
      diff: true
      register: diff_idem_output
    - name: Assert diff mode is idempotent
      ansible.builtin.assert:
        that:
          - diff_idem_output is not changed
          - diff_idem_output.diff is defined
          - diff_idem_output.diff.before.rules | length == 5
          - diff_idem_output.diff.after.rules | length == 5

    - name: Update tags
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        tags:
          testing: testing
          delete: never
          baz: bar
        append_tags: false
      register: output
    - name: Assert resource updated
      ansible.builtin.assert:
        that:
          - output.state.tags | length == 3
          - output.state.tags.delete == 'never'

    - name: Purge tags
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        append_tags: false
        tags:
          testing: testing
          delete: on-exit
      register: output
    - name: Assert resource updated
      ansible.builtin.assert:
        that:
          - output.state.tags | length == 2
          - output.state.tags.delete == 'on-exit'

    - name: Gather facts for one accounts
      azure.azcollection.azure_rm_securitygroup_info:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
      register: output
    - name: Assert resource retrieved
      ansible.builtin.assert:
        that:
          - output.securitygroups | length == 1

    - name: Gather facts for all accounts
      azure.azcollection.azure_rm_securitygroup_info:
        resource_group: "{{ resource_group }}-securitygroup01"
        tags:
          - testing:testing
      register: output_groups
    - name: Assert resource retrieved
      ansible.builtin.assert:
        that:
          - output_groups.securitygroups | length > 0

    - name: Create security group with source_address_prefixes
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        tags:
          testing: testing
          delete: on-exit
          foo: bar
        purge_rules: true
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix:
              - 52.100.120.240
              - 53.100.250.190
              - 54.110.200.200
            destination_port_range: 22
            access: Allow
            priority: 101
            direction: Inbound
      register: output
    - name: Assert resource created
      ansible.builtin.assert:
        that:
          - output.state.rules | length == 1
          - output.state.rules[0].source_address_prefixes | length == 3
          - not output.state.rules[0].source_address_prefix

    - name: Create security group with source_address_prefixes(idempotent)
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        tags:
          testing: testing
          delete: on-exit
          foo: bar
        purge_rules: true
        rules:
          - name: AllowSSH
            protocol: Tcp
            source_address_prefix:
              - 52.100.120.240
              - 53.100.250.190
              - 54.110.200.200
            destination_port_range: 22
            access: Allow
            priority: 101
            direction: Inbound
      register: output
    - name: Assert resource not updated
      ansible.builtin.assert:
        that: output is not changed

    - name: Add a single one group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        tags:
          testing: testing
          delete: on-exit
          foo: bar
        rules:
          - name: DenySSH
            protocol: Tcp
            source_address_prefix:
              - 54.120.120.240
            destination_port_range: 22
            access: Deny
            priority: 102
            direction: Inbound
      register: output
    - name: Assert resource updated
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.rules | length == 2

    # Use azure.azcollection.azure_rm_resource module to create with uppercase protocol name
    - name: Create security group with uppercase protocol name
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ resource_group }}-securitygroup01"
        provider: network
        resource_type: networkSecurityGroups
        resource_name: "{{ secgroupname }}"
        api_version: 2022-07-01
        body:
          location: "{{ output.state.location }}"
          properties:
            securityRules:
              - name: Upper_Protocal
                properties:
                  protocol: TCP  # UPPERCASE
                  access: Allow
                  sourceAddressPrefix: "*"
                  sourcePortRange: "*"
                  destinationAddressPrefix: "*"
                  destinationPortRange: 80
                  priority: 100
                  direction: Inbound

    - name: Create security group with capitalized protocol name(idempotent)
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        rules:
          - name: Upper_Protocal
            protocol: Tcp     # Capitalized
            access: Allow
            destination_port_range: 80
            priority: 100
            direction: Inbound
      register: output
    - name: Assert resource not updated
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Create Application security group 1
      azure.azcollection.azure_rm_applicationsecuritygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ asg_name1 }}"
        tags:
          testing: testing
      register: asg1

    - name: Create Application security group 2
      azure.azcollection.azure_rm_applicationsecuritygroup:
        resource_group: "{{ resource_group }}-securitygroup02"
        name: "{{ asg_name2 }}"
        tags:
          testing: testing
      register: asg2

    - name: Create security group with application security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ sg_name1 }}"
        purge_rules: true
        rules:
          - name: AsgToAsg
            protocol: Tcp
            source_application_security_groups:
              - "{{ asg1.id }}"
            destination_application_security_groups:
              - resource_group: "{{ resource_group }}-securitygroup02"
                name: "{{ asg_name2 }}"
            destination_port_range: 22
            access: Allow
            priority: 101
            direction: Inbound
      register: output
    - name: Assert resource retrieved
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create security group with application security group - Idempotent
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ sg_name1 }}"
        purge_rules: true
        rules:
          - name: AsgToAsg
            protocol: Tcp
            source_application_security_groups:
              - "{{ asg_name1 }}"
            destination_application_security_groups:
              - resource_group: "{{ resource_group }}-securitygroup02"
                name: "{{ asg_name2 }}"
            destination_port_range: 22
            access: Allow
            priority: 101
            direction: Inbound
      register: output
    - name: Assert resource not updated
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Delete security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ sg_name1 }}"
        state: absent

    - name: Delete security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ secgroupname }}"
        state: absent

    - name: Clean up Application security group 2
      azure.azcollection.azure_rm_applicationsecuritygroup:
        resource_group: "{{ resource_group }}-securitygroup01"
        name: "{{ asg_name1 }}"
        state: absent

    - name: Clean up Application security group 2
      azure.azcollection.azure_rm_applicationsecuritygroup:
        resource_group: "{{ resource_group }}-securitygroup02"
        name: "{{ asg_name2 }}"
        state: absent
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-{{ item }}"
        force_delete_nonempty: true
        state: absent
      loop:
        - securitygroup01
        - securitygroup02
