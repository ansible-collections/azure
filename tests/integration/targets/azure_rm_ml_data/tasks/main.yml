- name: Create a new resource group for ml-data test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-ml-data"
    location: eastus

- name: For ml-data topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}-{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-ml-data"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        new_resource_group: "{{ resource_group }}-ml-data"
        workspace_name: "workspace-{{ rpfx }}"
        dataasset_name: "data-{{ rpfx }}"

    - name: Create ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        location: "{{ location }}"
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        public_network_access: Enabled
      register: results

    - name: Assert the ML Workspace created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Data Asset
      azure.azcollection.azure_rm_ml_data:
        name: "{{ dataasset_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/data.schema.json
          name: local-folder-example
          description: Data asset created from local folder.
          type: uri_folder
          path: ./targets/azure_rm_ml_data/files/data
      register: results

    - name: Assert the ML Data Asset created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Data Asset (idempotent)
      azure.azcollection.azure_rm_ml_data:
        name: "{{ dataasset_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/data.schema.json
          name: local-folder-example
          description: Data asset created from local folder.
          type: uri_folder
          path: ./targets/azure_rm_ml_data/files/data
      register: results

    - name: Assert the ML Data Asset created (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: Create Data Asset (version 2)
      azure.azcollection.azure_rm_ml_data:
        name: "{{ dataasset_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 2
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/data.schema.json
          name: local-folder-example
          description: Data asset created from local folder.
          type: uri_folder
          path: ./targets/azure_rm_ml_data/files/data
      register: results

    - name: Assert the ML Data Asset created (version 2)
      ansible.builtin.assert:
        that:
          - results is changed

    - name: List ML Data Assets (archived)
      azure.azcollection.azure_rm_ml_data_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived data assets are zero
      ansible.builtin.assert:
        that:
          - results.ml_data_assets | length == 0

    - name: Archive Data Asset
      azure.azcollection.azure_rm_ml_data:
        name: "{{ dataasset_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Data Asset is archived
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Archive Data Asset (idempotent)
      azure.azcollection.azure_rm_ml_data:
        name: "{{ dataasset_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Data Asset is archived (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: List ML Data Assets (archived)
      azure.azcollection.azure_rm_ml_data_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived data assets are one
      ansible.builtin.assert:
        that:
          - results.ml_data_assets | length == 1

    # cleanup
    - name: Delete ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        all_resources: true
        permanently_delete: true
        state: absent
      register: results

    - name: Assert the ML Workspace deleted
      ansible.builtin.assert:
        that: results is changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ new_resource_group }}"
        force_delete_nonempty: true
        state: absent
