---
- name: Set Arc test resource group name
  ansible.builtin.set_fact:
    arc_onboarding_rg: "{{ resource_group }}-arc-onboarding"

- name: Create resource group for Azure Arc test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ arc_onboarding_rg }}"
    location: australiaeast

- name: Run Azure Arc tests
  block:
    # Setup VMs
    - name: Create Linux Azure VM
      ansible.builtin.include_tasks: setup.yml

    - name: Create Windows Azure VM
      ansible.builtin.include_tasks: setup_windows.yml

    # Prepare VMs for Arc
    - name: Prepare Linux Azure VM for Azure Arc
      ansible.builtin.include_tasks: prepare_vm_for_arc.yml

    - name: Prepare Windows Azure VM for Azure Arc
      ansible.builtin.include_tasks: prepare_vm_for_arc_windows.yml

    # Run tests
    - name: Test basic Azure Arc functionality on Linux
      ansible.builtin.include_tasks: test_basic.yml

    - name: Test basic Azure Arc functionality on Windows
      ansible.builtin.include_tasks: test_basic_windows.yml

  always:
    - name: Force delete the entire resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ arc_onboarding_rg }}"
        force_delete_nonempty: true
        state: absent
