---
# Basic Azure Arc functionality tests for Windows using the azure_arc role

- name: Test Azure Arc role - onboard Windows VM to Azure Arc
  ansible.builtin.import_role:
    name: azure_arc
  vars:
    azure_arc_resource_group: "{{ arc_onboarding_rg }}"
    azure_arc_subscription_id: "{{ azure_subscription_id }}"
    azure_arc_tenant_id: "{{ azure_tenant }}"
    azure_arc_tags:
      environment: "test"
      purpose: "arc-evaluation-windows"
      managed_by: "ansible-tests"
      os_type: "windows"
  delegate_to: arc_test_vm_windows

- name: Assert that Arc role set the resource ID for Windows VM
  ansible.builtin.assert:
    that:
      - azure_arc_resource_id is defined
      - azure_arc_resource_id | length > 0
    success_msg: "Azure Arc role set resource ID for Windows: {{ azure_arc_resource_id }}"
    fail_msg: "Azure Arc role did not set azure_arc_resource_id for Windows VM"
