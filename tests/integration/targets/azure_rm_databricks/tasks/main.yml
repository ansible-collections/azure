- name: Create a new resource group for databricks test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-databricks"
    location: westus3

- name: For databricks topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}-{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-databricks"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        resource_group: "{{ resource_group }}-databricks"
        managed_resource_group: "{{ resource_group }}-managed"
        managed_resource_group2: "{{ resource_group }}-params"
        workspace_name: "myDatabricksWorkspace-{{ rpfx }}"

    - name: Create a basic Databricks workspace
      azure.azcollection.azure_rm_databricks_workspace:
        resource_group: "{{ resource_group }}"
        name: "{{ workspace_name }}"
        location: "{{ location }}"
        managed_resource_group_id: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ managed_resource_group }}"
        sku:
          name: premium
        tags:
          environment: test
          purpose: demo
      register: workspace_result

    - name: Assert the workspace created
      ansible.builtin.assert:
        that:
          - workspace_result is changed
          - workspace_result.parameters.enable_no_public_ip.value == false

    - name: Display workspace information
      ansible.builtin.debug:
        var: workspace_result

    - name: Create a basic Databricks workspace (idempotent)
      azure.azcollection.azure_rm_databricks_workspace:
        resource_group: "{{ resource_group }}"
        name: "{{ workspace_name }}"
        location: "{{ location }}"
        managed_resource_group_id: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ managed_resource_group }}"
        sku:
          name: premium
        tags:
          environment: test
          purpose: demo
      register: workspace_result

    - name: Assert the workspace didn't change
      ansible.builtin.assert:
        that:
          - workspace_result is not changed

    - name: Get information about the workspace
      azure.azcollection.azure_rm_databricks_workspace_info:
        resource_group: "{{ resource_group }}"
        name: "{{ workspace_name }}"
      register: workspace_info

    - name: Display workspace info
      ansible.builtin.debug:
        var: workspace_info

    - name: List all workspaces in the resource group
      azure.azcollection.azure_rm_databricks_workspace_info:
        resource_group: "{{ resource_group }}"
      register: all_workspaces

    - name: Assert that we have more than 0 workspaces by resource_group
      ansible.builtin.assert:
        that:
          - all_workspaces.workspaces | length > 0

    - name: List all workspaces in the subscription
      azure.azcollection.azure_rm_databricks_workspace_info:
      register: subscription_workspaces

    - name: Assert that we have more than 0 workspaces by subscription
      ansible.builtin.assert:
        that:
          - subscription_workspaces.workspaces | length > 0

    # Example with parameters
    - name: Create Databricks workspace with parameters
      azure.azcollection.azure_rm_databricks_workspace:
        resource_group: "{{ resource_group }}"
        name: "{{ workspace_name }}-params"
        location: "{{ location }}"
        managed_resource_group_id: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ managed_resource_group2 }}"
        sku:
          name: premium
        parameters:
          enable_no_public_ip:
            value: true
        tags:
          environment: production
          purpose: analytics
      register: workspace_result

    - name: Assert the workspace created
      ansible.builtin.assert:
        that:
          - workspace_result is changed
          - workspace_result.parameters.enable_no_public_ip.value == true

    - name: Create Databricks workspace with parameters (Idempotent)
      azure.azcollection.azure_rm_databricks_workspace:
        resource_group: "{{ resource_group }}"
        name: "{{ workspace_name }}-params"
        location: "{{ location }}"
        managed_resource_group_id: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ managed_resource_group2 }}"
        sku:
          name: premium
        parameters:
          enable_no_public_ip:
            value: true
        tags:
          environment: production
          purpose: analytics
      register: workspace_result

    - name: Assert the workspace didn't change
      ansible.builtin.assert:
        that:
          - workspace_result is not changed

    # cleanup
    - name: Delete the workspace with parameters
      azure.azcollection.azure_rm_databricks_workspace:
        name: "{{ workspace_name }}-params"
        resource_group: "{{ resource_group }}"
        state: absent
      register: results

    - name: Assert the workspace deleted
      ansible.builtin.assert:
        that: results is changed

    - name: Delete the workspace
      azure.azcollection.azure_rm_databricks_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ resource_group }}"
        state: absent
      register: results

    - name: Assert the workspace deleted
      ansible.builtin.assert:
        that: results is changed

    - name: Delete the workspace (Idempotent)
      azure.azcollection.azure_rm_databricks_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ resource_group }}"
        state: absent
      register: results

    - name: Assert the workspace deleted (Idempotent)
      ansible.builtin.assert:
        that: results is not changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        force_delete_nonempty: true
        state: absent
