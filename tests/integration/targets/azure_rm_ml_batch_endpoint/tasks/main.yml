- name: Create a new resource group for ml-batch_endpoint test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-ml-batch_endpoint"
    location: eastus

- name: For ml-batch_endpoint topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-ml-batch_endpoint"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        new_resource_group: "{{ resource_group }}-ml-batch_endpoint"
        workspace_name: "workspace-{{ rpfx }}"
        batch_endpoint_name: "endpoint-command-{{ rpfx }}"

    - name: Create ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        location: "{{ location }}"
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        public_network_access: Enabled
      register: results

    - name: Assert the ML Workspace created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Batch Endpoint
      azure.azcollection.azure_rm_ml_batch_endpoint:
        name: "{{ batch_endpoint_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/batchEndpoint.schema.json
          name: hello-batch
          description: A hello world endpoint for component deployments.
          auth_mode: aad_token
      register: results

    - name: Assert the ML Batch Endpoint created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Batch Endpoint (idempotent)
      azure.azcollection.azure_rm_ml_batch_endpoint:
        name: "{{ batch_endpoint_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/batchEndpoint.schema.json
          name: hello-batch
          description: A hello world endpoint for component deployments.
          auth_mode: aad_token
      register: results

    - name: Assert the ML Batch Endpoint created (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: List ML Batch Endpoint
      azure.azcollection.azure_rm_ml_batch_endpoint_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
      register: results

    - name: Assert Archived batch_endpoints are one
      ansible.builtin.assert:
        that:
          - results.ml_batch_endpoints | length == 1

    # cleanup
    - name: Delete Batch Endpoint
      azure.azcollection.azure_rm_ml_batch_endpoint:
        name: "{{ batch_endpoint_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: absent
      register: results

    - name: Assert the ML Batch Endpoint deleted
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Delete Batch Endpoint (idempotent)
      azure.azcollection.azure_rm_ml_batch_endpoint:
        name: "{{ batch_endpoint_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: absent
      register: results

    - name: Assert the ML Batch Endpoint deleted (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: Delete ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        all_resources: true
        permanently_delete: true
        state: absent
      register: results

    - name: Assert the ML Workspace deleted
      ansible.builtin.assert:
        that: results is changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ new_resource_group }}"
        force_delete_nonempty: true
        state: absent
