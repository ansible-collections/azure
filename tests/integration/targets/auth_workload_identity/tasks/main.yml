- name: Workload identity can get subscription info
  azure.azcollection.azure_rm_account_info:
    auth_source: workload_identity
  register: acct

- name: Assert at least one subscription back
  ansible.builtin.assert:
    that:
      - acct is not failed
      - acct.subscriptions is defined
      - acct.subscriptions | length > 0
