- name: Create a new resource group for openshift cluster test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-{{ item }}"
    location: eastus
  loop:
    - openshiftmanagedcluster01
    - openshiftmanagedcluster02

- name: For openshift cluster test
  block:
    - name: Set variables
      ansible.builtin.set_fact:
        cluster_name: "{{ resource_group | hash('md5') | truncate(8, True, '') }}"

    - name: Get resource group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-openshiftmanagedcluster02"
      register: rg_output

    - name: Get available clusters for a specific resource_group
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
      register: output

    - name: Assert the cluster facts
      ansible.builtin.assert:
        that: output['clusters'] | length == 0

    - name: Get specific cluster information for a specific cluster
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
        name: "{{ cluster_name }}"
      register: output

    - name: Assert the cluster facts
      ansible.builtin.assert:
        that: output['clusters'].keys() | length == 0

    - name: Get all clusters
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
      register: output

    - name: Assert all clusters facts
      ansible.builtin.assert:
        that: output['clusters']['value'] | length == 0

    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
        name: testVnet
        address_prefixes_cidr:
          - 10.151.0.0/16
          - 10.152.0.0/16

    - name: Create master subnet
      azure.azcollection.azure_rm_subnet:
        name: master_foobar
        virtual_network_name: testVnet
        resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
        address_prefix_cidr: 10.151.0.0/24
      register: master_sub_output

    - name: Create work subnet
      azure.azcollection.azure_rm_subnet:
        name: worker_foobar
        virtual_network_name: testVnet
        resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
        address_prefix_cidr: 10.152.0.0/24
      register: worker_sub_output

    - name: Get available openshift cluster versions
      azure.azcollection.azure_rm_openshiftmanagedclusterversion_info:
        location: "eastus"
      register: ocp_cl_vers

    - name: Extract the latest available version
      ansible.builtin.set_fact:
        ocp_version: "{{ ocp_cl_vers.versions | community.general.version_sort | last }}"

    - name: Assert that selected ocp version is not empty
      ansible.builtin.assert:
        that: ocp_version | length != 0

    - name: Create openshift cluster
      azure.azcollection.azure_rm_openshiftmanagedcluster:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        name: "{{ cluster_name }}"
        location: "eastus"
        cluster_profile:
          cluster_resource_group_id: "{{ rg_output.resourcegroups[0].id }}"
          domain: "{{ cluster_name }}"
          version: "{{ ocp_version }}"
        service_principal_profile:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_secret }}"
        network_profile:
          pod_cidr: "10.128.0.0/14"
          service_cidr: "172.30.0.0/16"
        worker_profiles:
          - name: worker
            vm_size: "Standard_D4s_v3"
            subnet_id: "{{ worker_sub_output.state.id }}"
            disk_size: 128
            count: 3
        master_profile:
          vm_size: "Standard_D8s_v3"
          subnet_id: "{{ master_sub_output.state.id }}"
      register: output

    - name: Assert the cluster created
      ansible.builtin.assert:
        that: output is changed


    - name: Get available clusters for a specific resource_group
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
      register: output

    - name: Assert the cluster facts
      ansible.builtin.assert:
        that: output['clusters'] | length == 1

    - name: Get specific cluster information for a specific cluster
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        name: "{{ cluster_name }}"
      register: output

    - name: Assert the cluster facts
      ansible.builtin.assert:
        that: output['clusters']['name'] == "{{ cluster_name }}"

    - name: Get all clusters
      azure.azcollection.azure_rm_openshiftmanagedcluster_info:
      register: output

    - name: Assert all cluster
      ansible.builtin.assert:
        that: output['clusters'] | length >= 1

    - name: Fetch kubeconfig file to register
      azure.azcollection.azure_rm_openshiftmanagedclusterkubeconfig_info:
        name: "{{ cluster_name }}"
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
      register: kubeconfig_reg

    - name: Assert the kubeconfig file facts
      ansible.builtin.assert:
        that: kubeconfig_reg['kubeconfig'] | length >= 1

    - name: Fetch kubeconfig file with specific name
      azure.azcollection.azure_rm_openshiftmanagedclusterkubeconfig_info:
        name: "{{ cluster_name }}"
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        path: "/home/testuser/{{ cluster_name }}"

    - name: Check for created named kubeconfig file
      ansible.builtin.stat:
        path: "/home/testuser/{{ cluster_name }}"
      register: named_kubeconf_file

    - name: Assert kubeconfig file creation with specific name
      ansible.builtin.assert:
        that:
          - named_kubeconf_file.stat.exists
          - named_kubeconf_file.stat.size != 0

    - name: Fetch kubeconfig file with default name (kubeconfig)
      azure.azcollection.azure_rm_openshiftmanagedclusterkubeconfig_info:
        name: "{{ cluster_name }}"
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        path: "/home/testuser/"

    - name: Check for created default kubeconfig file
      ansible.builtin.stat:
        path: "/home/testuser/kubeconfig"
      register: default_kubeconf_file

    - name: Assert kubeconfig file creation with default name
      ansible.builtin.assert:
        that:
          - default_kubeconf_file.stat.exists
          - default_kubeconf_file.stat.size != 0

    - name: Delete openshift cluster
      azure.azcollection.azure_rm_openshiftmanagedcluster:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        name: "{{ cluster_name }}"
        location: "eastus"
        state: absent
      register: output

    - name: Assert the cluster deleted
      ansible.builtin.assert:
        that: output is changed

    - name: Create identities array for managed identity test
      ansible.builtin.set_fact:
        managed_identity_ids: []

    - name: Create user managed identity for ARO cluster
      ansible.builtin.include_tasks: "{{ role_path }}/../../../integration_common_tasks/managed_identity.yml"
      vars:
        managed_identity_test_unique: 'arocluster'
        managed_identity_unique: "{{ item }}"
        managed_identity_action: 'create'
        managed_identity_location: "eastus"
        new_resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
      with_items:
        - '1'

    - name: Create openshift cluster with managed identity (check mode)
      azure.azcollection.azure_rm_openshiftmanagedcluster:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        name: "{{ cluster_name }}mi"
        location: "eastus"
        identity:
          type: UserAssigned
          user_assigned_identities:
            id:
              - "{{ managed_identity_ids[0] }}"
        cluster_profile:
          cluster_resource_group_id: "{{ rg_output.resourcegroups[0].id }}"
          domain: "{{ cluster_name }}mi"
          version: "{{ ocp_version }}"
        platform_workload_identity_profile:
          platform_workload_identities:
            ServiceOperator.ARO.OpenShift.IO:
              resource_id: "{{ managed_identity_ids[0] }}"
        network_profile:
          pod_cidr: "10.128.0.0/14"
          service_cidr: "172.30.0.0/16"
        worker_profiles:
          - name: worker
            vm_size: "Standard_D4s_v3"
            subnet_id: "{{ worker_sub_output.state.id }}"
            disk_size: 128
            count: 3
        master_profile:
          vm_size: "Standard_D8s_v3"
          subnet_id: "{{ master_sub_output.state.id }}"
      check_mode: true
      register: mi_check_output

    - name: Assert the managed identity cluster check mode returns changed
      ansible.builtin.assert:
        that: mi_check_output is changed

    - name: Verify mutual exclusion - should fail with both SP and identity
      azure.azcollection.azure_rm_openshiftmanagedcluster:
        resource_group: "{{ resource_group }}-openshiftmanagedcluster01"
        name: "{{ cluster_name }}mi"
        location: "eastus"
        identity:
          type: UserAssigned
          user_assigned_identities:
            id:
              - "{{ managed_identity_ids[0] }}"
        service_principal_profile:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_secret }}"
        cluster_profile:
          cluster_resource_group_id: "{{ rg_output.resourcegroups[0].id }}"
          domain: "{{ cluster_name }}mi"
        platform_workload_identity_profile:
          platform_workload_identities:
            ServiceOperator.ARO.OpenShift.IO:
              resource_id: "{{ managed_identity_ids[0] }}"
        network_profile:
          pod_cidr: "10.128.0.0/14"
          service_cidr: "172.30.0.0/16"
        worker_profiles:
          - name: worker
            vm_size: "Standard_D4s_v3"
            subnet_id: "{{ worker_sub_output.state.id }}"
            disk_size: 128
            count: 3
        master_profile:
          vm_size: "Standard_D8s_v3"
          subnet_id: "{{ master_sub_output.state.id }}"
      register: mutual_excl_output
      ignore_errors: true

    - name: Assert mutual exclusion fails
      ansible.builtin.assert:
        that: mutual_excl_output is failed

    - name: Delete user managed identities
      ansible.builtin.include_tasks: "{{ role_path }}/../../../integration_common_tasks/managed_identity.yml"
      vars:
        managed_identity_test_unique: 'arocluster'
        managed_identity_unique: "{{ item }}"
        managed_identity_action: 'delete'
        managed_identity_location: "eastus"
        new_resource_group: "{{ resource_group }}-openshiftmanagedcluster02"
      with_items:
        - '1'
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-{{ item }}"
        force_delete_nonempty: true
        state: absent
      loop:
        - openshiftmanagedcluster01
        - openshiftmanagedcluster02
