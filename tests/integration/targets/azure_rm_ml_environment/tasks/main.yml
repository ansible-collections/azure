- name: Create a new resource group for ml-environment test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-ml-environment"
    location: eastus

- name: For ml-environment topic test
  block:
    - name: Create resource prefix
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
      run_once: true

    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-ml-environment"
      register: __rg_info

    - name: Set test variables
      ansible.builtin.set_fact:
        location: "{{ __rg_info.resourcegroups.0.location }}"
        new_resource_group: "{{ resource_group }}-ml-environment"
        workspace_name: "workspace-{{ rpfx }}"
        environment_name: "environment{{ rpfx }}"

    - name: Create ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        location: "{{ location }}"
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        public_network_access: Enabled
      register: results

    - name: Assert the ML Workspace created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Environment
      azure.azcollection.azure_rm_ml_environment:
        name: "{{ environment_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
          image: mcr.microsoft.com/azureml/openmpi3.1.2-ubuntu18.04:20220303.v1
          conda_file: ./targets/azure_rm_ml_environment/files/python-aml-rai.yaml
      register: results

    - name: Assert the ML Environment created
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Create Environment (idempotent)
      azure.azcollection.azure_rm_ml_environment:
        name: "{{ environment_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 1
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
          image: mcr.microsoft.com/azureml/openmpi3.1.2-ubuntu18.04:20220303.v1
          conda_file: ./targets/azure_rm_ml_environment/files/python-aml-rai.yaml
      register: results

    - name: Assert the ML Environment created (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: Create Environment (version 2)
      azure.azcollection.azure_rm_ml_environment:
        name: "{{ environment_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        version: 2
        resource_definition: |
          $schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
          image: mcr.microsoft.com/azureml/openmpi3.1.2-ubuntu18.04:20220303.v1
          conda_file: ./targets/azure_rm_ml_environment/files/python-aml-rai.yaml
      register: results

    - name: Assert the ML Environment created (version 2)
      ansible.builtin.assert:
        that:
          - results is changed

    - name: List ML Environment (archived)
      azure.azcollection.azure_rm_ml_environment_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived environments are zero
      ansible.builtin.assert:
        that:
          - results.ml_environments | length == 0

    - name: Archive Environment
      azure.azcollection.azure_rm_ml_environment:
        name: "{{ environment_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Environment is archived
      ansible.builtin.assert:
        that:
          - results is changed

    - name: Archive Environment (idempotent)
      azure.azcollection.azure_rm_ml_environment:
        name: "{{ environment_name }}"
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        state: archive
      register: results

    - name: Assert the ML Environment is archived (idempotent)
      ansible.builtin.assert:
        that:
          - results is not changed

    - name: List ML Environment (archived)
      azure.azcollection.azure_rm_ml_environment_info:
        resource_group: "{{ new_resource_group }}"
        ml_workspace: "{{ workspace_name }}"
        list_type: archived
      register: results

    - name: Assert Archived environments are one
      ansible.builtin.assert:
        that:
          - results.ml_environments | length == 1

    # cleanup
    - name: Delete ML Workspace
      azure.azcollection.azure_rm_ml_workspace:
        name: "{{ workspace_name }}"
        resource_group: "{{ new_resource_group }}"
        all_resources: true
        permanently_delete: true
        state: absent
      register: results

    - name: Assert the ML Workspace deleted
      ansible.builtin.assert:
        that: results is changed

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ new_resource_group }}"
        force_delete_nonempty: true
        state: absent
