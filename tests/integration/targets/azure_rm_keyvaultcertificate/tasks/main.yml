- name: Create a new resource group for key vault certificate test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-keyvaultcertificate"
    location: eastus

- name: For key vault certificate test
  block:
    - name: Prepare random number
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
        tenant_id: "{{ azure_tenant }}"
        cert_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', 'punctuation'], length=12) }}"
        cert_file: "cert.txt"
      run_once: true

    - name: Lookup service principal object id
      ansible.builtin.set_fact:
        object_id: "{{ lookup('azure.azcollection.azure_service_principal_attribute',
                       azure_client_id=azure_client_id,
                       azure_secret=azure_secret,
                       azure_tenant=tenant_id) }}"
      register: object_id_facts

    - name: Create instance of Key Vault
      azure.azcollection.azure_rm_keyvault:
        resource_group: "{{ resource_group }}-keyvaultcertificate"
        vault_name: "vault{{ rpfx }}"
        enabled_for_deployment: true
        vault_tenant: "{{ tenant_id }}"
        sku:
          name: standard
          family: A
        access_policies:
          - tenant_id: "{{ tenant_id }}"
            object_id: '{{ object_id }}'
            keys:
              - get
              - list
              - update
              - create
              - import
              - delete
            secrets:
              - get
              - list
              - set
              - delete
            certificates:
              - get
              - list
              - delete
              - create
              - import
              - update
              - managecontacts
              - recover
              - purge
      register: output

    - name: Generate a keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        policy:
          subject: 'CN=Anhui02'
          issuer_name: self
          exportable: true
          key_type: RSA
          key_size: 2048
          san_emails:
            - 7170222076@qq.com
          content_type: 'application/x-pkcs12'
          validity_in_months: 36
          lifetime_actions:
            - action: EmailContacts
              days_before_expiry: 10
        enabled: true
        state: generate
        tags:
          key1: value1
      register: output

    - name: Assert the keyvault certificate created
      ansible.builtin.assert:
        that: output is changed

    - name: For the keyvault certificate idempotent test
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        policy:
          subject: 'CN=Anhui02'
          issuer_name: self
          exportable: true
          key_type: RSA
          key_size: 2048
          san_emails:
            - 7170222076@qq.com
          content_type: 'application/x-pkcs12'
          validity_in_months: 36
          lifetime_actions:
            - action: EmailContacts
              days_before_expiry: 10
        enabled: true
        state: update
        tags:
          key1: value1
      register: output

    - name: Assert the keyvault certificate no changed
      ansible.builtin.assert:
        that: output is not changed

    - name: Update thekeyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        policy:
          subject: 'CN=Anhui02'
          issuer_name: self
          exportable: true
          key_type: RSA
          key_size: 2048
          san_emails:
            - 7170222076@qq.com
          content_type: 'application/x-pkcs12'
          validity_in_months: 38
          lifetime_actions:
            - action: EmailContacts
              days_before_expiry: 20
        enabled: false
        state: update
        tags:
          key2: value2
      register: output

    - name: Assert the keyvault certificate changed
      ansible.builtin.assert:
        that: output is changed

    - name: Get the keyvault certificate facts
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
      register: facts

    - name: Assert certificate facts
      ansible.builtin.assert:
        that:
          - facts['certificates'][0]['name'] is defined
          - facts['certificates'][0]['properties']['tags'] | length == 2
          - facts['certificates'][0]['properties']['attributes']['enabled'] is false
          - facts['certificates'][0]['policy']['validity_in_months'] == 38
          - facts['certificates'][0]['policy']['lifetime_actions'][0]['days_before_expiry'] == 20

    - name: Import a keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}-secondary"
        password: "{{ cert_password }}"
        cert_data: "{{ lookup('file', cert_file) }}"
        state: import
      register: output

    - name: Assert the keyvault certificate imported
      ansible.builtin.assert:
        that: output is changed

    - name: List all active keyvault certificates (no name, default show_deleted_certificate)
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
      register: list_active_facts

    - name: Assert active certificate listing returns the expected shape
      ansible.builtin.assert:
        that:
          - list_active_facts['certificates'] is defined
          - list_active_facts['certificates'] is iterable
          # imported "-secondary" cert is enabled by default and should be present;
          # the original "cert{{ rpfx }}" is disabled and is intentionally skipped.
          - list_active_facts['certificates'] | length >= 1
          - "'cert' + rpfx + '-secondary' in (list_active_facts['certificates'] | map(attribute='name') | list)"
          - "'cert' + rpfx not in (list_active_facts['certificates'] | map(attribute='name') | list)"
          - list_active_facts['certificates'][0]['policy'] is defined
          - list_active_facts['certificates'][0]['properties']['attributes'] is defined

    - name: List all active keyvault certificates with include_pending=true
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        include_pending: true
      register: list_active_pending_facts

    - name: Assert include_pending listing succeeds
      ansible.builtin.assert:
        that:
          - list_active_pending_facts['certificates'] is defined
          - list_active_pending_facts['certificates'] is iterable

    - name: List active certificates with a non-matching tag filter
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        tags:
          - this_tag_does_not_exist
      register: list_active_tag_facts

    - name: Assert tag filter narrows the listing to zero items
      ansible.builtin.assert:
        that:
          - list_active_tag_facts['certificates'] | length == 0

    - name: Delete the keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "{{ item }}"
        state: delete
      register: output
      with_items:
        - "cert{{ rpfx }}"
        - "cert{{ rpfx }}-secondary"

    - name: List all delete keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        show_deleted_certificate: true
      register: facts

    - name: Assert certificate facts
      ansible.builtin.assert:
        that:
          - facts['certificates'] | length == 2

    - name: Recover the keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        state: recover
      register: output

    - name: Assert the keyvault certificate recovered
      ansible.builtin.assert:
        that: output is changed

    - name: Purge the keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}-secondary"
        state: purge
      register: output

    - name: Assert the keyvault certificate purged
      ansible.builtin.assert:
        that: output is changed

    - name: List all delete keyvault certificate
      azure.azcollection.azure_rm_keyvaultcertificate_info:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        show_deleted_certificate: true
      register: facts

    - name: Assert certificate facts
      ansible.builtin.assert:
        that:
          - facts['certificates'] | length == 0

    - name: Generate test RSA private key (PEM)
      ansible.builtin.command:
        cmd: >
          openssl genrsa -out "{{ playbook_dir }}/cert.key" 2048
      args:
        creates: "{{ playbook_dir }}/cert.key"

    - name: Generate self-signed certificate (PEM)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -new -nodes -key "{{ playbook_dir }}/cert.key"
          -sha256 -days 365 -subj "/CN=ansible-test" -out "{{ playbook_dir }}/cert.crt"
      args:
        creates: "{{ playbook_dir }}/cert.crt"

    - name: Build PEM bundle (key + cert) for Key Vault import
      ansible.builtin.copy:
        dest: "{{ cert_file }}"
        mode: "0600"
        content: |
          {{ lookup('file', playbook_dir ~ '/cert.key') }}
          {{ lookup('file', playbook_dir ~ '/cert.crt') }}

    - name: Import new certificate for rotation
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        cert_data: "{{ lookup('file', cert_file) }}"
        state: import
        policy:
          content_type: "application/x-pem-file"
      register: rotate_result

    - name: Assert the keyvault certificate rotated
      ansible.builtin.assert:
        that: rotate_result is changed

    - name: Re-import same certificate PEM (idempotent check)
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert{{ rpfx }}"
        cert_data: "{{ lookup('file', cert_file) }}"
        state: import
        policy:
          content_type: "application/x-pem-file"
      register: idempotent_result

    - name: Assert no change on re-import
      ansible.builtin.assert:
        that: idempotent_result is not changed

    - name: Generate PKCS#12 bundle from generated key and cert
      ansible.builtin.command:
        cmd: >
          openssl pkcs12 -export
          -inkey "{{ playbook_dir }}/cert.key"
          -in "{{ playbook_dir }}/cert.crt"
          -out "{{ playbook_dir }}/cert.pfx"
          -passout pass:{{ cert_password }}
      args:
        creates: "{{ playbook_dir }}/cert.pfx"

    - name: Import PKCS#12 certificate
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert-pfx-{{ rpfx }}"
        cert_data: "{{ lookup('file', playbook_dir ~ '/cert.pfx') | b64encode }}"
        password: "{{ cert_password }}"
        state: import
        policy:
          content_type: "application/x-pkcs12"
      register: rotate_pfx_result

    - name: Assert the keyvault certificate PKCS#12 rotated
      ansible.builtin.assert:
        that: rotate_pfx_result is changed

    - name: Re-import same certificate PFX (idempotent check)
      azure.azcollection.azure_rm_keyvaultcertificate:
        vault_uri: https://vault{{ rpfx }}.vault.azure.net
        name: "cert-pfx-{{ rpfx }}"
        cert_data: "{{ lookup('file', playbook_dir ~ '/cert.pfx') | b64encode }}"
        password: "{{ cert_password }}"
        state: import
        policy:
          content_type: "application/x-pkcs12"
      register: idempotent_pfx_result

    - name: Assert no change on re-import of PFX
      ansible.builtin.assert:
        that: idempotent_pfx_result is not changed

    - name: Delete instance of Key Vault
      azure.azcollection.azure_rm_keyvault:
        resource_group: "{{ resource_group }}-keyvaultcertificate"
        vault_name: "vault{{ rpfx }}"
        state: absent
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-keyvaultcertificate"
        force_delete_nonempty: true
        state: absent
