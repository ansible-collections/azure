- name: Set variables
  ansible.builtin.include_tasks: setup.yml

- name: Create minimal VM with defaults
  azure.azcollection.azure_rm_virtualmachine:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ vm_name }}"
    admin_username: "testuser"
    ssh_password_enabled: false
    open_ports:
      - 33
    ssh_public_keys:
      - path: /home/testuser/.ssh/authorized_keys
        key_data: "ssh-rsa  xiuxi.sun@qq.com"
    vm_size: Standard_D2s_v3
    network_interfaces: "{{ interface_name }}"
    virtual_network: "{{ network_name }}"
    created_nsg: false
    image:
      offer: 0001-com-ubuntu-server-focal
      publisher: Canonical
      sku: 20_04-lts
      version: latest
  register: vm_output

- name: Query auto created security group before deleting
  azure.azcollection.azure_rm_securitygroup_info:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ vm_name }}01"
  register: nsg_result

- name: Assert that security group were not exist before deleting
  ansible.builtin.assert:
    that:
      - nsg_result.securitygroups | length == 0

- name: Delete VM
  azure.azcollection.azure_rm_virtualmachine:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ vm_name }}"
    remove_on_absent: all_autocreated
    state: absent

- name: Delete the network interface
  azure.azcollection.azure_rm_networkinterface:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ interface_name }}"
    state: absent

- name: Destroy subnet
  azure.azcollection.azure_rm_subnet:
    resource_group: "{{ resource_group }}-vm01"
    virtual_network: "{{ network_name }}"
    name: "{{ subnet_name }}"
    state: absent

- name: Destroy virtual network
  azure.azcollection.azure_rm_virtualnetwork:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ network_name }}"
    state: absent

- name: Destroy availability set
  azure.azcollection.azure_rm_availabilityset:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ availability_set }}"
    state: absent

- name: Destroy storage account
  azure.azcollection.azure_rm_storageaccount:
    resource_group: "{{ resource_group }}-vm01"
    name: "{{ storage_account }}"
    force_delete_nonempty: true
    state: absent
