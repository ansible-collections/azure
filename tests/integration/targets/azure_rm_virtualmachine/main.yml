---
- name: Run Azure VM tests in parallel
  hosts: all
  gather_facts: false
  strategy: linear
  tasks:
    - name: Create the first resource group for Virtual machine test
      azure_rm_resourcegroup:
        name: "{{ resource_group }}-vm01"
        location: eastus
      ignore_errors: true

    - name: Create the secondary resource group for Virtual machine test
      azure_rm_resourcegroup:
        name: "{{ resource_group }}-vm02"
        location: eastus
      ignore_errors: true

    - name: For Virtual machine test
      block:
        - name: Include tasks based on inventory hostname
          ansible.builtin.include_tasks: tasks/{{ inventory_hostname }}.yml

      always:
        - name: Force delete the resource group
          azure_rm_resourcegroup:
            name: "{{ resource_group }}-{{ item }}"
            force_delete_nonempty: true
            state: absent
          loop:
            - vm01
            - vm02
