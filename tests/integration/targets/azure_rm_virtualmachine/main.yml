---
- name: Run Azure VM tests in parallel
  hosts: all
  gather_facts: false
  strategy: linear
  tasks:
    - name: Get the first resource group status
      azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-vm01"
      register: output

    - name: Create first resource group for Virtual machine test
      azure_rm_resourcegroup:
        name: "{{ resource_group }}-vm01"
        location: eastus
      when: output.resourcegroups |length == 0

    - name: Get the secondary resource group status
      azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-vm02"
      register: output

    - name: Create secondary resource group for Virtual machine test
      azure_rm_resourcegroup:
        name: "{{ resource_group }}-vm02"
        location: eastus
      when: output.resourcegroups |length == 0

    - name: For Virtual machine test
      block:
        - name: Include tasks based on inventory hostname
          ansible.builtin.include_tasks: tasks/{{ inventory_hostname }}.yml

      always:
        - name: Force delete the resource group
          azure_rm_resourcegroup:
            name: "{{ resource_group }}-{{ item }}"
            force_delete_nonempty: true
            state: absent
          loop:
            - vm01
            - vm02
