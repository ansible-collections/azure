- name: Create a new resource group for subnet test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-{{ item }}"
    location: eastus
  loop:
    - sub01
    - sub02

- name: For subnet test
  block:
    - name: Set variable
      ansible.builtin.set_fact:
        rpfx: "{{ resource_group | hash('md5') | truncate(20, True, '') }}"

    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: My_Virtual_Network
        address_prefixes_cidr:
          - 10.1.0.0/16
          - 10.2.0.0/16
          - 172.100.0.0/16
          - fdda:e69b:1587:495e::/64
        dns_servers:
          - 127.0.0.1
          - 127.0.0.3
        tags:
          testing: testing
          delete: on-exit
        resource_group: "{{ resource_group }}-sub01"

    - name: Create route table
      azure.azcollection.azure_rm_routetable:
        name: routetableforsubnet
        resource_group: "{{ resource_group }}-sub01"
      register: route_table

    - name: Remove subnet
      azure.azcollection.azure_rm_subnet:
        state: absent
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"

    - name: Catch invalid cidr
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0/24"
      register: output
      ignore_errors: true

    - name: Assert created fail
      ansible.builtin.assert:
        that: output is failed

    - name: Add the subnet back
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/24"
      register: output

    - name: Assert the subnet created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.address_prefix == "10.1.0.0/24"

    - name: Add the subnet back (idempontent)
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Create network security group
      azure.azcollection.azure_rm_securitygroup:
        name: secgroupfoo
        resource_group: "{{ resource_group }}-sub01"
        tags:
          testing: testing

    - name: Update the subnet
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/16"
        security_group: secgroupfoo
        service_endpoints:
          - service: Microsoft.Sql
            locations:
              - eastus
              - westus

    - name: Should be idempotent
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/16"
        service_endpoints:
          - service: Microsoft.Sql
            locations:
              - eastus
              - westus
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Able to completely remove service endpoints
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/16"
        service_endpoints: []
      register: output

    - name: Assert the subnet updated
      ansible.builtin.assert:
        that: output.state.service_endpoints is not defined

    - name: Create network security group in another resource group
      azure.azcollection.azure_rm_securitygroup:
        name: secgroupfoo
        resource_group: "{{ resource_group }}-sub02"
      register: nsg

    - name: Update the subnet
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/16"
        route_table: "{{ route_table.id }}"
        security_group:
          name: secgroupfoo
          resource_group: "{{ resource_group }}-sub02"
      register: output

    - name: Assert the subnet update
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.network_security_group.id == nsg.state.id

    - name: Update the subnet (idempotent)
      azure.azcollection.azure_rm_subnet:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.1.0.0/16"
        route_table: "{{ route_table.id }}"
        security_group: "{{ nsg.state.id }}"
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Create subnet with IPv4 and IPv6
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        default_outbound_access: false
        address_prefixes_cidr:
          - "172.100.0.0/16"
          - "fdda:e69b:1587:495e::/64"
      register: output

    - name: Assert the subnet created
      ansible.builtin.assert:
        that:
          - output is changed
          - not output.state.address_prefix
          - output.state.address_prefixes | length > 0
          - output.state.default_outbound_access is false

    - name: Update the subnet to IPv4 and IPv6 (idempotent)
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        default_outbound_access: false
        address_prefixes_cidr:
          - "172.100.0.0/16"
          - "fdda:e69b:1587:495e::/64"
      register: output

    - name: Assert the subnet updated
      ansible.builtin.assert:
        that: output is not changed

    - name: Update the subnet's IPv4 and IPv6 address
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefixes_cidr:
          - "172.100.0.0/24"
          - "fdda:e69b:1587:495e::/64"
        default_outbound_access: true
        security_group: "{{ nsg.state.id }}"
      register: output

    - name: Assert the subnet update
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.default_outbound_access is true

    - name: Update the subnet with network policies
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        private_link_service_network_policies: Disabled
        private_endpoint_network_policies: Enabled
      register: output

    - name: Assert the subnet updated
      ansible.builtin.assert:
        that: output is changed

    - name: The subnet with network policies should be idempotent
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        private_link_service_network_policies: Disabled
        private_endpoint_network_policies: Enabled
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Update the subnet with delegations
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        delegations:
          - name: 'mydeleg'
            serviceName: 'Microsoft.ContainerInstance/containerGroups'
      register: output

    - name: Assert the subnet updated
      ansible.builtin.assert:
        that: output is changed

    - name: The subnet with delegations should be idempotent
      azure.azcollection.azure_rm_subnet:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        delegations:
          - name: 'mydeleg'
            serviceName: 'Microsoft.ContainerInstance/containerGroups'
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Get subnet facts
      azure.azcollection.azure_rm_subnet_info:
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
      register: output

    - name: Assert that facts are returned
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.subnets[0]['id'] != None
          - output.subnets[0]['resource_group'] != None
          - output.subnets[0]['virtual_network_name'] != None
          - output.subnets[0]['name'] != None
          - not output.subnets[0]['address_prefix_cidr']
          - output.subnets[0]['address_prefixes_cidr'] != None
          - output.subnets[0]['security_group'] != None
          - output.subnets[0]['provisioning_state'] != None
          - output.subnets[0]['private_endpoint_network_policies'] != None
          - output.subnets[0]['private_link_service_network_policies'] != None
          - output.subnets[0]['delegations'] != None
          - output.subnets[0]['default_outbound_access'] is true

    - name: Get subnet facts
      azure.azcollection.azure_rm_subnet_info:
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
      register: output

    - name: Assert that facts are returned
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.subnets[0]['id'] != None
          - output.subnets[0]['resource_group'] != None
          - output.subnets[0]['virtual_network_name'] != None
          - output.subnets[0]['name'] != None
          - output.subnets[0]['route_table'] != None
          - output.subnets[0]['address_prefix_cidr'] != None
          - output.subnets[0]['security_group'] != None
          - output.subnets[0]['provisioning_state'] != None

    - name: Create a new Service Endpoint Policy(Checkmode test)
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
        location: eastus
        tags:
          key: value
      check_mode: true
      register: output

    - name: Assert there is no Service Endpoint Policy
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new Service Endpoint Policy
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
        location: eastus
        tags:
          key: value
      register: output

    - name: Assert the Service Endpoint Policy created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Recreate the Service Endpoint Policy(Idempotent test)
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
        location: eastus
        tags:
          key: value
      register: output

    - name: Assert the Service Endpoint Policy no update
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update the Service Endpoint Policy(Update test)
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
        location: eastus
        tags:
          key1: value1
      register: output

    - name: Assert the Service Endpoint Policy updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create the secondary Service Endpoint Policy
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-secondary"
        location: eastus
        tags:
          key: value
      register: output

    - name: Assert the secondary Service Endpoint Policy created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the first Service Endpoint Policy
      azure_rm_serviceendpointpolicy_info:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
      register: output

    - name: Assert the data collection endpoint facts
      ansible.builtin.assert:
        that:
          - output.serviceendpointpolicies[0].tags |length == 2

    - name: List all Service Endpoint Policy in same resource_group
      azure_rm_serviceendpointpolicy_info:
        resource_group: "{{ resource_group }}-sub01"
      register: sep_output

    - name: Create the first storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-sub01"
        name: "s{{ rpfx }}01"
        account_type: Standard_LRS
        kind: StorageV2
      register: storage_output1

    - name: Create the secondary storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-sub01"
        name: "s{{ rpfx }}02"
        account_type: Standard_LRS
        kind: StorageV2
      register: storage_output2

    - name: Create a new Service Endpoint Policy Definition(Checkmode test)
      azure_rm_serviceendpointpolicydefinition:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
        description: "Create a new SEP definition"
        service: "Microsoft.Storage"
        service_resources:
          - "{{ storage_output1.state.id }}"
      register: output
      check_mode: true

    - name: Assert there is no Service Endpoint Policy Definition
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new Service Endpoint Policy Definition
      azure_rm_serviceendpointpolicydefinition:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
        description: "Create a new SEP definition"
        service: "Microsoft.Storage"
        service_resources:
          - "{{ storage_output1.state.id }}"
      register: output

    - name: Assert the Service Endpoint Policy Definition created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Re-Create the Service Endpoint Policy Definition(Idempotent test)
      azure_rm_serviceendpointpolicydefinition:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
        description: "Create a new SEP definition"
        service: "Microsoft.Storage"
        service_resources:
          - "{{ storage_output1.state.id }}"
      register: output

    - name: Assert the Service Endpoint Policy Definition no change
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update the Service Endpoint Policy Definition
      azure_rm_serviceendpointpolicydefinition:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
        description: "Update the SEP definition"
        service: "Microsoft.Storage"
        service_resources:
          - "{{ storage_output2.state.id }}"
      register: output

    - name: Assert the Service Endpoint Policy Definition updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the Service Endpoint Policy facts
      azure_rm_serviceendpointpolicydefinition_info:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
      register: output

    - name: Assert the Service Endpoint Policy Definition facts
      ansible.builtin.assert:
        that:
          - output.serviceendpointpolicydefinitions[0].service_resources |length == 2
          - output.serviceendpointpolicydefinitions[0].description == "Update the SEP definition"

    - name: Add the third subnet back
      azure.azcollection.azure_rm_subnet:
        name: foobar02
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.2.0.0/24"
        service_endpoint_policies:
          - id: "{{ sep_output.serviceendpointpolicies[0].id }}"
        service_endpoints:
          - service: Microsoft.Storage
            locations:
              - eastus
              - westus
      register: output

    - name: Update the third subnet back with SEP
      azure.azcollection.azure_rm_subnet:
        name: foobar02
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        address_prefix_cidr: "10.2.0.0/24"
        service_endpoint_policies:
          - id: "{{ sep_output.serviceendpointpolicies[1].id }}"
        service_endpoints:
          - service: Microsoft.Storage
            locations:
              - eastus
              - westus
      register: output

    - name: Get the third subnet facts
      azure.azcollection.azure_rm_subnet_info:
        name: foobar02
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
      register: output

    - name: Assert the third subnet facts are returned
      ansible.builtin.assert:
        that:
          - output.subnets[0]['id'] != None
          - output.subnets[0]['service_endpoint_policies'] |length == 2

    - name: Remove subnet
      azure.azcollection.azure_rm_subnet:
        state: absent
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"

    - name: Remove subnet (idempotent)
      azure.azcollection.azure_rm_subnet:
        state: absent
        name: foobar
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that: output is not changed

    - name: Remove subnet
      azure.azcollection.azure_rm_subnet:
        state: absent
        name: foobar01
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"

    - name: Remove security group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}-sub01"
        name: secgroupfoo
        state: absent

    - name: Remove the third subnet
      azure.azcollection.azure_rm_subnet:
        state: absent
        name: foobar02
        virtual_network_name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"

    - name: Remove the Service Endpoint Policy Definition
      azure_rm_serviceendpointpolicydefinition:
        resource_group: "{{ resource_group }}-sub01"
        service_endpoint_policy_name: "policy-{{ rpfx }}-first"
        name: "definition-{{ rpfx }}"
        state: absent

    - name: Remove the fist storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-sub01"
        name: "s{{ rpfx }}01"
        state: absent

    - name: Remove the secondary storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}-sub01"
        name: "s{{ rpfx }}02"
        state: absent

    - name: Remove the first Service Endpoint Policy
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-first"
        state: absent

    - name: Remove the secondary Service Endpoint Policy
      azure_rm_serviceendpointpolicy:
        resource_group: "{{ resource_group }}-sub01"
        name: "policy-{{ rpfx }}-secondary"
        state: absent

    - name: Remove virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: My_Virtual_Network
        resource_group: "{{ resource_group }}-sub01"
        state: absent

  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-{{ item }}"
        force_delete_nonempty: true
        state: absent
      loop:
        - sub01
        - sub02
