- name: Create a new resource group for virtual network hub test
  azure_rm_resourcegroup:
    name: "{{ resource_group }}-vnethub"
    location: eastus

- name: For virtual network hub test
  block:
    - name: Set varialbles
      ansible.builtin.set_fact:
        name_rpfx: "{{ resource_group | hash('md5') | truncate(22, True, '') }}"

    - name: Create a VirtualHub (check mode)
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}"
        sku: Standard
      check_mode: true

    - name: Create a VirtualHub
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}"
        sku: Standard
      register: output

    - name: Assert the virtual hub is well created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.provisioning_state == 'Succeeded'

    - name: Create a VirtualHub (idempotent)
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}"
        sku: Standard
      register: output

    - name: Assert idempotent
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Get Virtual Hub Info
      azure_rm_virtualhub_info:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}"
      register: output

    - name: Assert fact returns
      ansible.builtin.assert:
        that:
          - output.virtual_hubs[0].provisioning_state == "Succeeded"
          - output.virtual_hubs[0].sku == "Standard"

    - name: Create a VirtualWan
      azure_rm_virtualwan:
        resource_group: "{{ resource_group }}-vnethub"
        name: "wan-{{ name_rpfx }}"
        disable_vpn_encryption: true
        allow_branch_to_branch_traffic: true
        allow_vnet_to_vnet_traffic: true
        virtual_wan_type: Standard
      register: output

    - name: Create Second VirtualHub
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}-seondary"
        sku: Standard
        address_prefix: 12.0.0.0/16
        virtual_wan:
          id: "{{ output.state.id }}"
        virtual_router_asn: 65515
        virtual_router_ips:
          - 12.0.32.4
          - 12.0.32.5
      register: output

    - name: Assert the virtual hub is well created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.state.provisioning_state == 'Succeeded'

    - name: Get the secondary VirtualHub and confirm the routing state is Provisioned
      azure_rm_virtualhub_info:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}-seondary"
      register: output
      until: output.virtual_hubs[0].routing_state == "Provisioned"
      retries: 30
      delay: 60

    - name: Delete Second VirtualHub
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}-seondary"
        state: absent

    - name: Delete virtual hub
      azure_rm_virtualhub:
        resource_group: "{{ resource_group }}-vnethub"
        name: "{{ name_rpfx }}"
        state: absent
      register: output

    - name: Assert the AKS instance is upgraded
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the VirtualHub and confirm it deleted
      azure_rm_virtualhub_info:
        resource_group: "{{ resource_group }}-vnethub"
      register: output
      until: output.virtual_hubs |length == 0
      retries: 60
      delay: 60

  always:
    - name: Force delete the resource group
      azure_rm_resourcegroup:
        name: "{{ resource_group }}-vnethub"
        force_delete_nonempty: true
        state: absent
