- name: Create a new resource group for role definition test
  azure_rm_resourcegroup:
    name: "{{ resource_group }}-roledefinition"
    location: eastus

- name: For role definition test
  block:
    - name: Fix resource prefix
      ansible.builtin.set_fact:
        my_role_name: "{{ (resource_group | replace('-', 'x'))[-8:] }}{{ 1000 | random }}testrole"
        subscription_id: "{{ azure_subscription_id }}"
        principal_id: "{{ azure_client_id }}"
      run_once: true

    - name: Create a role definition (Check Mode)
      azure_rm_roledefinition:
        name: "{{ my_role_name }}"
        scope: "/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}-roledefinition"
        permissions:
          - actions:
              - "Microsoft.Compute/virtualMachines/read"
            not_actions:
              - "Microsoft.Compute/virtualMachines/write"
            data_actions:
              - "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"
            not_data_actions:
              - "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write"
        assignable_scopes:
          - "/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}-roledefinition"
      check_mode: true
      register: output

    - name: Assert creating role definition check mode
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a role definition
      azure_rm_roledefinition:
        name: "{{ my_role_name }}"
        scope: "/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}-roledefinition"
        permissions:
          - actions:
              - "Microsoft.Compute/virtualMachines/read"
            not_actions:
              - "Microsoft.Compute/virtualMachines/write"
            data_actions:
              - "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"
            not_data_actions:
              - "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write"
        assignable_scopes:
          - "/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}-roledefinition"
      register: output

    - name: Assert creating role definition
      ansible.builtin.assert:
        that:
          - output is changed


