- name: Create a new resource group for Azure Front Door original test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-afdoriginal"
    location: eastus

- name: For Azure Front Door original test
  block:
    - name: Prepare random name for Profile & EndPoint & Origin Group & Origin
      ansible.builtin.set_fact:
        profile: "prof-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        origin_group: "origin-group-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        origin: "origin-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        origin2: "origin2-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"

    - name: Create Standard Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        location: "Global"
        resource_group: "{{ resource_group }}-afdoriginal"
        sku: "standard_azurefrontdoor"
        state: "present"

    - name: Create Origin Group
      azure.azcollection.azure_rm_afdorigingroup:
        name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        health_probe_settings:
          probe_interval_in_seconds: 100
          probe_path: "/"
          probe_protocol: "Https"
          probe_request_type: "HEAD"
        load_balancing_settings:
          additional_latency_in_milliseconds: 50
          sample_size: 4
          successful_samples_required: 3
      register: output

    - name: Create Origin
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        host_name: "10.0.0.1"
        origin_host_header: "10.0.0.1"
        http_port: 80
        https_port: 443
        priority: 1
        weight: 123
      register: output

    - name: Assert the resource was created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Update Origin (idempotent test)
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        host_name: "10.0.0.1"
        origin_host_header: "10.0.0.1"
        http_port: 80
        https_port: 443
        priority: 1
        weight: 123
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Load Origin info
      azure.azcollection.azure_rm_afdorigin_info:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
      register: output

    - name: Assert the resource has the proper values set
      ansible.builtin.assert:
        that:
          - output.afdorigins | length == 1
          - output.afdorigins[0].enabled_state == 'Enabled'
          - output.afdorigins[0].host_name == '10.0.0.1'
          - output.afdorigins[0].http_port == 80
          - output.afdorigins[0].https_port == 443
          - output.afdorigins[0].id is defined
          - output.afdorigins[0].origin_host_header == '10.0.0.1'
          - output.afdorigins[0].priority == 1
          - output.afdorigins[0].weight == 123
          - output is not changed

    - name: Create Origin 2
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin2 }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        host_name: "10.0.1.2"
        origin_host_header: "10.0.1.2"
        http_port: 80
        https_port: 443
        priority: 2
        weight: 234
      register: output

    - name: Assert the resource was created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Load Origin info for both
      azure.azcollection.azure_rm_afdorigin_info:
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
      register: output

    - name: Assert the resource has the proper values set
      ansible.builtin.assert:
        that:
          - output.afdorigins | length == 2
          - output is not changed

    - name: Update Origin (with different values)
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        host_name: "10.0.0.2"
        origin_host_header: "10.0.0.2"
        http_port: 8080
        priority: 1
        weight: 111
      register: output

    - name: Assert the resource was changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Update Origin Group (idempotent test)
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "present"
        host_name: "10.0.0.2"
        origin_host_header: "10.0.0.2"
        http_port: 8080
        priority: 1
        weight: 111
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Delete Origin
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "absent"
      register: output

    - name: Assert the resource was deleted
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete Origin 2
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin2 }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "absent"
      register: output

    - name: Assert the resource was delete
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete Origin (idempotent test)
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "absent"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Delete Origin Group
      azure.azcollection.azure_rm_afdorigingroup:
        name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "absent"
      register: output

    - name: Delete Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        location: "Global"
        resource_group: "{{ resource_group }}-afdoriginal"
        state: "absent"
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-afdoriginal"
        force_delete_nonempty: true
        state: absent
