- name: Create a new resource group for Azure Front Door route test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-afdroute"
    location: eastus

- name: For Azure Front Door route test
  block:
    - name: Prepare random name for Profile & EndPoint & Origin Group & Origin
      ansible.builtin.set_fact:
        profile: "prof-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        endpoint: "endpoint-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        origin_group: "origin-group-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        ruleset: "ruleset{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        origin: "origin-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"
        route: "route-{{ resource_group | hash('md5') | truncate(4, True, '') }}{{ 100000 | random }}"

    - name: Create Standard Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        location: "Global"
        resource_group: "{{ resource_group }}-afdroute"
        sku: "standard_azurefrontdoor"
        state: "present"

    - name: Create EndPoint
      azure.azcollection.azure_rm_afdendpoint:
        name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        enabled_state: "Enabled"
        state: "present"

    - name: Create Origin Group
      azure.azcollection.azure_rm_afdorigingroup:
        name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "present"
        health_probe_settings:
          probe_interval_in_seconds: 100
          probe_path: "/"
          probe_protocol: "Https"
          probe_request_type: "HEAD"
        load_balancing_settings:
          additional_latency_in_milliseconds: 50
          sample_size: 4
          successful_samples_required: 3
      register: output

    - name: Create Origin
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "present"
        host_name: "10.0.0.1"
        origin_host_header: "10.0.0.1"
        http_port: 80
        https_port: 443
        priority: 1
        weight: 123
      register: output

    - name: Create Ruleset
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "present"

    - name: Create Route
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        enabled_state: "Enabled"
        forwarding_protocol: "HttpsOnly"
        https_redirect: "Disabled"
        link_to_default_domain: "Enabled"
        origin_group: "{{ origin_group }}"
        patterns_to_match:
          - "/auto/*"
        rule_sets:
          - "{{ ruleset }}"
        supported_protocols:
          - "Https"
        state: "present"
      register: output

    - name: Assert the resource was created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Update Route (idempotent test)
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        enabled_state: "Enabled"
        forwarding_protocol: "HttpsOnly"
        https_redirect: "Disabled"
        link_to_default_domain: "Enabled"
        origin_group: "{{ origin_group }}"
        patterns_to_match:
          - "/auto/*"
        rule_sets:
          - "{{ ruleset }}"
        supported_protocols:
          - "Https"
        state: "present"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.id is defined

    - name: Load Route info
      azure.azcollection.azure_rm_afdroute_info:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
      register: output

    - name: Assert the resource has the proper values set
      ansible.builtin.assert:
        that:
          - output.afdroutes | length == 1
          - output.afdroutes[0].enabled_state == 'Enabled'
          - output.afdroutes[0].id is defined
          - output.afdroutes[0].rule_sets | length == 1
          - output is not changed

    - name: Update Route (with different values)
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        enabled_state: "Disabled"
        forwarding_protocol: "HttpsOnly"
        https_redirect: "Disabled"
        link_to_default_domain: "Enabled"
        origin_group: "{{ origin_group }}"
        patterns_to_match:
          - "/auto/*"
          - "/test/*"
        rule_sets:
          - "{{ ruleset }}"
        supported_protocols:
          - "Https"
          - "Http"
        state: "present"
      register: output

    - name: Assert the resource was changed
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Update Route (idempotent test)
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        enabled_state: "Disabled"
        forwarding_protocol: "HttpsOnly"
        https_redirect: "Disabled"
        link_to_default_domain: "Enabled"
        origin_group: "{{ origin_group }}"
        patterns_to_match:
          - "/auto/*"
          - "/test/*"
        rule_sets:
          - "{{ ruleset }}"
        supported_protocols:
          - "Https"
          - "Http"
        state: "present"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.id is defined

    - name: Delete Route
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        origin_group: "{{ origin_group }}"
        state: "absent"
      register: output

    - name: Assert the resource was changed
      ansible.builtin.assert:
        that:
          - output is changed
          - output.id is defined

    - name: Delete Route (idempotent test)
      azure.azcollection.azure_rm_afdroute:
        name: "{{ route }}"
        endpoint_name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        origin_group: "{{ origin_group }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "absent"
      register: output

    - name: Assert the resource was not changed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Delete Origin
      azure.azcollection.azure_rm_afdorigin:
        name: "{{ origin }}"
        origin_group_name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "absent"

    - name: Delete Origin Group
      azure.azcollection.azure_rm_afdorigingroup:
        name: "{{ origin_group }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "absent"
      register: output

    - name: Create Ruleset
      azure.azcollection.azure_rm_afdruleset:
        name: "{{ ruleset }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "absent"

    - name: Delete EndPoint
      azure.azcollection.azure_rm_afdendpoint:
        name: "{{ endpoint }}"
        profile_name: "{{ profile }}"
        resource_group: "{{ resource_group }}-afdroute"
        state: "absent"
      register: output

    - name: Delete Frontdoor Profile
      azure.azcollection.azure_rm_cdnprofile:
        name: "{{ profile }}"
        location: "Global"
        resource_group: "{{ resource_group }}-afdroute"
        sku: "standard_azurefrontdoor"
        state: "absent"
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-afdroute"
        force_delete_nonempty: true
        state: absent
