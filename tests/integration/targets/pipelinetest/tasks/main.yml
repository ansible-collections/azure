- name: Set variables
  ansible.builtin.set_fact:
    test_var:
      - name: test1
      - name: test2
      - name: test3

- name: Print the variables
  ansible.builtin.debug:
    msg: "{{ test_var }}"


- name: Print the name list
  ansible.builtin.debug:
    msg: "{{ test_var | map(attribute='name') | list }}"
