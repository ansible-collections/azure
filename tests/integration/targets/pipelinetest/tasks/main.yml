- name: Set variables
  ansible.builtin.set_fact:
    test_var:
      - name: test1
      - name: test2
      - name: test3
- name: Print the variables
  ansible.builtin.debug:
    var: test_var

- name: Print the name
  ansible.builtin.debug:
    msg: "{{ test_var | json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    msg: "{{ test_var | ansible.builtin.json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    msg: "{{ test_var | community.general.json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: "{{ test_var | json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: "{{ test_var | ansible.builtin.json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: "{{ test_var | community.general.json_query('[*].name') }}"
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: test_var | json_query('[*].name')
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: test_var | ansible.builtin.json_query('[*].name')
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: test_var | community.general.json_query('[*].name')
  ignore_errors: true

- name: Print the name
  ansible.builtin.debug:
    var: test_var | community.general.json_query('[*].name')
