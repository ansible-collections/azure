- name: Create a new resource group for log analystics workspace test
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}-loganalyticsworkspace"
    location: westeurope

- name: For log analystics workspace test
  block:
    - name: Gather Resource Group info
      azure.azcollection.azure_rm_resourcegroup_info:
        name: "{{ resource_group }}-loganalyticsworkspace"
      register: __rg_info

    - name: Prepare random number
      ansible.builtin.set_fact:
        name_rpfx: "loganalytics{{ resource_group | hash('md5') | truncate(7, True, '') }}{{ 1000 | random }}"
        retention_days: 60
        location: "{{ __rg_info.resourcegroups.0.location }}"

    - name: Create User Managed Identities
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        provider: ManagedIdentity
        resource_type: userAssignedIdentities
        resource_name: "{{ item }}"
        api_version: "2023-01-31"
        body:
          location: "{{ location }}"
        state: present
      loop:
        - "ansible-test-loganalyze-identity"
      register: user_assigned_id_creation

    - name: Set identities IDs to test. Identities ansible-test-loganalyze-identity have to be created previously
      ansible.builtin.set_fact:
        user_identity_1: "{{ user_assigned_id_creation.results.0.response.id }}"

    - name: Create Log Analytics Workspace (Check Mode On)
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        intelligence_packs:
          Backup: true
          Containers: true
        retention_in_days: "{{ retention_days }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        identity:
          type: SystemAssigned
      check_mode: true
      register: output

    - name: Assert there is no log analytics workspace
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get Log Analytics workspace information
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        show_intelligence_packs: true
        show_management_groups: true
        show_shared_keys: true
        show_usages: true
      register: facts

    - name: Assert the log analytics workspace facts
      ansible.builtin.assert:
        that:
          - facts.workspaces | length == 0

    - name: Create Log Analytics Workspace
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        intelligence_packs:
          Backup: true
          Containers: true
        retention_in_days: 30
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        tags:
          key1: value1
        identity:
          type: SystemAssigned
      register: output

    - name: Assert the log analytics workspace created
      ansible.builtin.assert:
        that:
          - output is changed
          - output.retention_in_days == 30
          - output.intelligence_packs | selectattr('name', 'equalto', 'Backup') | map(attribute='enabled') | first == true
          - output.intelligence_packs | selectattr('name', 'equalto', 'Containers') | map(attribute='enabled') | first == true
          - output.sku == 'per_gb2018'
          - output.tags.key1 == 'value1'
          - output.identity.type == 'SystemAssigned'

    - name: Update Log Analytics Workspace
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        intelligence_packs:
          Backup: false
          Containers: false
        retention_in_days: "{{ retention_days }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        tags:
          key1: value1
          key2: value2
        identity:
          type: UserAssigned
          user_assigned_identity: "{{ user_identity_1 }}"
      register: output

    - name: Assert the log analytics workspace updated
      ansible.builtin.assert:
        that:
          - output is changed
          - output.retention_in_days == retention_days
          - output.tags.key2 == 'value2'
          - output.identity.type == 'UserAssigned'
          - output.identity.user_assigned_identities | length == 1

    - name: Get Log Analytics workspace information (Show full information)
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        show_intelligence_packs: true
        show_management_groups: true
        show_shared_keys: true
        show_usages: true
      register: facts

    - name: Assert the log analytics workspace facts
      ansible.builtin.assert:
        that:
          - facts is not changed
          - facts.workspaces | length > 0
          - facts.workspaces[0].retention_in_days == retention_days
          - facts.workspaces[0].intelligence_packs | length > 0
          - facts.workspaces[0].intelligence_packs | selectattr('name', 'equalto', 'Containers') | map(attribute='enabled') | first == false
          - facts.workspaces[0].intelligence_packs | selectattr('name', 'equalto', 'Backup') | map(attribute='enabled') | first == false
          - facts.workspaces[0].shared_keys is defined
          - facts.workspaces[0].shared_keys.primary_shared_key is defined
          - facts.workspaces[0].shared_keys.secondary_shared_key is defined
          - facts.workspaces[0].usages is defined
          - facts.workspaces[0].usages | length > 0
          - facts.workspaces[0].management_groups is defined
          - facts.workspaces[0].sku == 'per_gb2018'
          - user_identity_1 in facts.workspaces[0].identity.user_assigned_identities

    - name: Get Log Analytics workspace information (Show default information)
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: facts

    - name: Assert the log analytics workspace facts
      ansible.builtin.assert:
        that:
          - facts is not changed
          - facts.workspaces | length > 0
          - facts.workspaces[0].retention_in_days == retention_days
          - facts.workspaces[0].intelligence_packs is not defined
          - facts.workspaces[0].shared_keys is not defined
          - facts.workspaces[0].usages is not defined
          - facts.workspaces[0].management_groups is not defined
          - facts.workspaces[0].sku == 'per_gb2018'

    - name: Create Log Analytics workspace (Test Idempotence)
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        retention_in_days: "{{ retention_days }}"
      register: log_analytics_workspace_output

    - name: Assert the log anaytics workspace already created
      ansible.builtin.assert:
        that:
          - log_analytics_workspace_output is not changed

    - name: Create data collection rule (check mode)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        location: "{{ location }}"
        kind: Linux
        description: Test for linux data collection rule
        data_sources:
          performance_counters:
            - name: perfCounterDataSource
              streams:
                - Microsoft-Perf
              sampling_frequency_in_seconds: 60
              counter_specifiers:
                - Processor(*)\\% Processor Time
                - Processor(*)\\% Idle Time
        destinations:
          log_analytics:
            - workspace_resource_id: "{{ log_analytics_workspace_output.id }}"
              name: "{{ log_analytics_workspace_output.name }}"
        data_flows:
          - destinations:
              - "{{ log_analytics_workspace_output.name }}"
            streams:
              - Microsoft-Perf
      check_mode: true
      register: output

    - name: Assert the data collection rule is created (check mode)
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create data collection rule (no tags)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        location: "{{ location }}"
        kind: Linux
        description: Test for linux data collection rule
        data_sources:
          performance_counters:
            - name: perfCounterDataSource
              streams:
                - Microsoft-Perf
              sampling_frequency_in_seconds: 60
              counter_specifiers:
                - Processor(*)\\% Processor Time
                - Processor(*)\\% Idle Time
        destinations:
          log_analytics:
            - workspace_resource_id: "{{ log_analytics_workspace_output.id }}"
              name: "{{ log_analytics_workspace_output.name }}"
        data_flows:
          - destinations:
              - "{{ log_analytics_workspace_output.name }}"
            streams:
              - Microsoft-Perf
      register: output

    - name: Assert the data collection rule is created (no tags)
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create data collection rule (no tags, idempotency check)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        location: "{{ location }}"
        kind: Linux
        description: Test for linux data collection rule
        data_sources:
          performance_counters:
            - name: perfCounterDataSource
              streams:
                - Microsoft-Perf
              sampling_frequency_in_seconds: 60
              counter_specifiers:
                - Processor(*)\\% Processor Time
                - Processor(*)\\% Idle Time
        destinations:
          log_analytics:
            - workspace_resource_id: "{{ log_analytics_workspace_output.id }}"
              name: "{{ log_analytics_workspace_output.name }}"
        data_flows:
          - destinations:
              - "{{ log_analytics_workspace_output.name }}"
            streams:
              - Microsoft-Perf
      register: output

    - name: Assert the data collection rule is already created (no tags)
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Create data collection rule (creation tags)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-creationtags-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        location: "{{ location }}"
        kind: Linux
        description: Test for linux data collection rule
        data_sources:
          performance_counters:
            - name: perfCounterDataSource
              streams:
                - Microsoft-Perf
              sampling_frequency_in_seconds: 60
              counter_specifiers:
                - Processor(*)\\% Processor Time
                - Processor(*)\\% Idle Time
        destinations:
          log_analytics:
            - workspace_resource_id: "{{ log_analytics_workspace_output.id }}"
              name: "{{ log_analytics_workspace_output.name }}"
        data_flows:
          - destinations:
              - "{{ log_analytics_workspace_output.name }}"
            streams:
              - Microsoft-Perf
        tags:
          CreationTag1: CreationTagValue1
      register: output

    - name: Assert the data collection rule is created (creation tags)
      ansible.builtin.assert:
        that:
          - output is changed
          - output.datacollectionrule.tags.CreationTag1 == 'CreationTagValue1'

    - name: Create data collection rule (creation tags, idempotency check)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-creationtags-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        location: "{{ location }}"
        kind: Linux
        description: Test for linux data collection rule
        data_sources:
          performance_counters:
            - name: perfCounterDataSource
              streams:
                - Microsoft-Perf
              sampling_frequency_in_seconds: 60
              counter_specifiers:
                - Processor(*)\\% Processor Time
                - Processor(*)\\% Idle Time
        destinations:
          log_analytics:
            - workspace_resource_id: "{{ log_analytics_workspace_output.id }}"
              name: "{{ log_analytics_workspace_output.name }}"
        data_flows:
          - destinations:
              - "{{ log_analytics_workspace_output.name }}"
            streams:
              - Microsoft-Perf
        tags:
          CreationTag1: CreationTagValue1
      register: output

    - name: Assert the data collection rule is already created (creation tags)
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.datacollectionrule.tags.CreationTag1 == 'CreationTagValue1'

    - name: Add tag to data collection rule
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
        tags:
          TestTag1: TestValue1
      register: output

    - name: Assert the data collection rule tags are updated
      ansible.builtin.assert:
        that:
          - output is changed
          - output.datacollectionrule.tags.TestTag1 == 'TestValue1'

    - name: Add tag to data collection rule (Idempotency)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
        tags:
          TestTag1: TestValue1
      register: output

    - name: Assert the data collection rule tags are updated (Idempotency)
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.datacollectionrule.tags.TestTag1 == 'TestValue1'

    - name: Add tag to data collection rule (append)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: true
        tags:
          TestTag2: TestValue2
      register: output

    - name: Assert the data collection rule tags are updated (append)
      ansible.builtin.assert:
        that:
          - output is changed
          - output.datacollectionrule.tags.TestTag1 == 'TestValue1'
          - output.datacollectionrule.tags.TestTag2 == 'TestValue2'

    - name: Add tag to data collection rule (append, idempotency)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: true
        tags:
          TestTag2: TestValue2
      register: output

    - name: Assert the data collection rule tags are updated (append, idempotency)
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.datacollectionrule.tags.TestTag1 == 'TestValue1'
          - output.datacollectionrule.tags.TestTag2 == 'TestValue2'

    - name: Replace tags of data collection rule
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
        tags:
          TestTag3: TestValue3
      register: output

    - name: Assert the data collection rule tags are replaced
      ansible.builtin.assert:
        that:
          - output is changed
          - output.datacollectionrule.tags.TestTag1 is not defined
          - output.datacollectionrule.tags.TestTag2 is not defined
          - output.datacollectionrule.tags.TestTag3 == 'TestValue3'

    - name: Replace tags of data collection rule (idempotency)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
        tags:
          TestTag3: TestValue3
      register: output

    - name: Assert the data collection rule tags are replaced (idempotency)
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.datacollectionrule.tags.TestTag1 is not defined
          - output.datacollectionrule.tags.TestTag2 is not defined
          - output.datacollectionrule.tags.TestTag3 == 'TestValue3'

    - name: Remove tags of data collection rule
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
      register: output

    - name: Assert the data collection rule tags are removed
      ansible.builtin.assert:
        that:
          - output is changed
          - output.datacollectionrule.tags.TestTag1 is not defined
          - output.datacollectionrule.tags.TestTag2 is not defined
          - output.datacollectionrule.tags.TestTag3 is not defined

    - name: Remove tags of data collection rule (idempotency)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        append_tags: false
      register: output

    - name: Assert the data collection rule tags are removed (idempotency)
      ansible.builtin.assert:
        that:
          - output is not changed
          - output.datacollectionrule.tags.TestTag1 is not defined
          - output.datacollectionrule.tags.TestTag2 is not defined
          - output.datacollectionrule.tags.TestTag3 is not defined

    - name: Use info module to gather information on data collection rule (direct match)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: rule_output

    - name: Assert that data collection rule is present (direct match)
      ansible.builtin.assert:
        that:
          - rule_output.datacollectionrules.0.name == name_rpfx + '-DCR'

    - name: Use info module to gather information on data collection rules in resource group (list resource group)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: output

    - name: Assert that data collection rule is present (list resource group)
      ansible.builtin.assert:
        that:
          - name_rpfx + '-DCR' in (output.datacollectionrules | map(attribute='name') | list)

    - name: Use info module to gather information on data collection rules in subscription (list subscription)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
      register: output

    - name: Assert that data collection rule is present (list subscription)
      ansible.builtin.assert:
        that:
          - name_rpfx + '-DCR' in (output.datacollectionrules | map(attribute='name') | list)

    - name: Create a new monitor data collection endpoint(Checkmode test)
      azure_rm_monitordatacollectionendpoint:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
        description: Create
        kind: Linux
        tags:
          key1: value1
        network_acls:
          public_network_access: Disabled
      check_mode: true
      register: output

    - name: Assert there is no data collection endpoint
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new monitor data collection endpoint
      azure_rm_monitordatacollectionendpoint:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
        description: Create
        kind: Linux
        tags:
          key1: value1
        network_acls:
          public_network_access: Disabled
      register: output

    - name: Assert the data collection endpoint is created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new monitor data collection endpoint(Idempotent test)
      azure_rm_monitordatacollectionendpoint:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
        description: Create
        kind: Linux
        tags:
          key1: value1
        network_acls:
          public_network_access: Disabled
      register: output

    - name: Assert the data collection endpoint is already created
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update the monitor data collection endpoint
      azure_rm_monitordatacollectionendpoint:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
        description: "Update"
        kind: Windows
        tags:
          key2: value2
        network_acls:
          public_network_access: Enabled
      register: output

    - name: Assert the data collection endpoint is updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the monitor data collection endpoint
      azure_rm_monitordatacollectionendpoint_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
      register: endpoint_output

    - name: Assert the data collection endpoint facts
      ansible.builtin.assert:
        that:
          - endpoint_output.datacollectionendpoints[0].tags |length == 2
          - endpoint_output.datacollectionendpoints[0].description == 'Update'
          - endpoint_output.datacollectionendpoints[0].kind == 'Windows'
          - endpoint_output.datacollectionendpoints[0].network_acls.public_network_access == 'Enabled'

    - name: Create virtual network
      azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "vnet-{{ name_rpfx }}"
        address_prefixes: 10.42.8.0/24

    - name: Create subnet
      azure_rm_subnet:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "subnet-{{ name_rpfx }}"
        address_prefix: 10.42.8.0/28
        virtual_network: "vnet-{{ name_rpfx }}"

    - name: Create VM
      azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "vm-{{ name_rpfx }}"
        admin_username: "testuser"
        ssh_password_enabled: false
        open_ports:
          - 33
        ssh_public_keys:
          - path: /home/testuser/.ssh/authorized_keys
            key_data: "ssh-rsa  xiuxi.sun@qq.com"
        vm_size: Standard_B1ms
        managed_disk_type: Standard_LRS
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest

    - name: Cet the VM facts
      azure_rm_virtualmachine_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "vm-{{ name_rpfx }}"
      register: vm_output

    - name: Create a new monitor data collection association with endpoint(Checkmode test)
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
        data_collection_endpoint_id: "{{ endpoint_output.datacollectionendpoints[0].id }}"
        description: "Create a data collection endpoint association"
      register: output
      check_mode: true

    - name: Assert the data collection rule association is created(Checkmode test)
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new monitor data collection association with endpoint
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
        data_collection_endpoint_id: "{{ endpoint_output.datacollectionendpoints[0].id }}"
        description: "Create a collection endpoint association"
      register: output

    - name: Assert the data collection rule association is created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create a new monitor data collection association with endpoint(Idempotent test)
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
        data_collection_endpoint_id: "{{ endpoint_output.datacollectionendpoints[0].id }}"
        description: "Create collection endpoint association"
      register: output

    - name: Assert the data collection rule association is no change
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Update the monitor data collection association with endpoint
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
        data_collection_endpoint_id: "{{ endpoint_output.datacollectionendpoints[0].id }}"
        description: "Update the collection endpoint association"
      register: output

    - name: Assert the data collection rule association is updated
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Create the secondary monitor data collection association with rule
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: "rule-{{ name_rpfx }}"
        data_collection_rule_id: "{{ rule_output.datacollectionrules[0].id }}"
        description: "Update the collection endpoint association"
      register: output

    - name: Assert the secondary data collection rule association is created
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get the monitor data collection association facts by association_name
      azure_rm_monitordatacollectionruleassociation_info:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
      register: output

    - name: Assert the specify association facts
      ansible.builtin.assert:
        that:
          - output.datacollectionruleassociations |length == 1
          - output.datacollectionruleassociations[0].description == "Update the collection endpoint association"

    - name: List all monitor data collection association facts by resource_uri
      azure_rm_monitordatacollectionruleassociation_info:
        resource_uri: "{{ vm_output.vms[0].id }}"
      register: output

    - name: Assert the association facts
      ansible.builtin.assert:
        that:
          - output.datacollectionruleassociations |length == 2

    - name: List monitor data collection association by rule
      azure_rm_monitordatacollectionruleassociation_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        data_collection_rule_name: "{{ rule_output.datacollectionrules[0].name }}"
      register: output

    - name: Assert the DCR association facts
      ansible.builtin.assert:
        that:
          - output.datacollectionruleassociations |length == 1

    - name: Get the monitor data collection association by endpoint
      azure_rm_monitordatacollectionruleassociation_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        data_collection_endpoint_name: "{{ endpoint_output.datacollectionendpoints[0].name }}"
      register: output

    - name: Assert the DCE association facts
      ansible.builtin.assert:
        that:
          - output.datacollectionruleassociations |length == 1

    - name: Delete the first monitor data collection association
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: configurationAccessEndpoint
        state: absent
      register: output

    - name: Assert the first data collection rule association is deleted
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete the secondary monitor data collection association
      azure_rm_monitordatacollectionruleassociation:
        resource_uri: "{{ vm_output.vms[0].id }}"
        association_name: "rule-{{ name_rpfx }}"
        state: absent
      register: output

    - name: Assert the secondary data collection rule association is deleted
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Delete the monitor data collection endpoint
      azure_rm_monitordatacollectionendpoint:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        name: "{{ name_rpfx }}-DCE"
        state: absent
      register: output

    - name: Assert the data collection endpoint is deleted
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Remove data collection rule (Check Mode On)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
      check_mode: true
      register: output

    - name: Assert the data collection rule is changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Remove data collection rule
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
      register: output

    - name: Assert the data collection rule is changed
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Remove data collection rule (check if actually removed)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
      register: output

    - name: Assert the data collection rule is already removed
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Use info module to make sure data collection rule is gone (direct match)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
        name: "{{ name_rpfx }}-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: output

    - name: Assert that data collection rule is not present (direct match)
      ansible.builtin.assert:
        that:
          - output.datacollectionrules | length == 0

    - name: Use info module to gather information on data collection rules in resource group (list resource group)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: output

    - name: Assert that data collection rule is not present (list resource group)
      ansible.builtin.assert:
        that:
          - name_rpfx + '-DCR' not in (output.datacollectionrules | map(attribute='name') | list)

    - name: Use info module to gather information on data collection rules in subscription (list subscription)
      azure.azcollection.azure_rm_monitordatacollectionrules_info:
      register: output

    - name: Assert that data collection rule is not present (list subscription)
      ansible.builtin.assert:
        that:
          - name_rpfx + '-DCR' not in (output.datacollectionrules | map(attribute='name') | list)

    - name: Remove data collection rule (creation tags)
      azure.azcollection.azure_rm_monitordatacollectionrules:
        name: "{{ name_rpfx }}-creationtags-DCR"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
      register: output

    - name: Assert the data collection rule is changed (creation tags)
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Remove Log Analytics workspace (Check Mode On)
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
      check_mode: true
      register: output

    - name: Assert there is no log anaytics workspace
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get Log Analytics workspace information(Check still exists after remove Check Mode On)
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: facts

    - name: Assert the log analytics workspace facts
      ansible.builtin.assert:
        that:
          - facts.workspaces | length == 1

    - name: List the Log Analytics workspace under specific resource group
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        tags:
          - key2
      register: facts

    - name: Assert only one log analytics workspace
      ansible.builtin.assert:
        that:
          - facts.workspaces | length == 1

    - name: List all Log Analytics workspaces and filter unexist tags
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        tags:
          - unexist
      register: facts

    - name: Assert there is no log analytics workspace
      ansible.builtin.assert:
        that:
          - facts.workspaces | length == 0

    - name: Remove Log Analytics workspace
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
        force: true
      register: output

    - name: Assert the log analytics workspace deleted
      ansible.builtin.assert:
        that:
          - output is changed

    - name: Get Log Analytics workspace information
      azure.azcollection.azure_rm_loganalyticsworkspace_info:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
      register: facts

    - name: Assert the log analytics workspace facts
      ansible.builtin.assert:
        that:
          - facts.workspaces | length == 0

    - name: Remove Log Analytics workspace (Test Idempotence)
      azure.azcollection.azure_rm_loganalyticsworkspace:
        name: "{{ name_rpfx }}"
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        state: absent
        force: true
      register: output

    - name: Assert the log analytics workspace deleted
      ansible.builtin.assert:
        that:
          - output is not changed

    - name: Destroy User Managed Identities
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ resource_group }}-loganalyticsworkspace"
        provider: ManagedIdentity
        resource_type: userAssignedIdentities
        resource_name: "{{ item }}"
        api_version: "2023-01-31"
        state: absent
      loop:
        - "ansible-test-loganalyze-identity"
  always:
    - name: Force delete the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}-loganalyticsworkspace"
        force_delete_nonempty: true
        state: absent
