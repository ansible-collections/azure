---
# Indirect node counting query for the azure.azcollection collection.
#
# This jq runs inside the Automation Platform controller
# (awx/main/tasks/host_indirect.py) against each module's result, and its output
# feeds subscription node counting. Nothing in this repository executes it, so
# tests/unit/audit/test_event_query_contract.py asserts the contract the
# controller imposes on the output.
#
# FOUR THINGS THAT ARE EASY TO GET WRONG HERE
# -------------------------------------------
# 0. `name` must be unique within a job. IndirectManagedNodeAudit declares
#    `unique_together = [('name', 'job')]`, and the controller bulk_create()s
#    every record for a job in one transaction. Two resources that dedup
#    apart but share a `name` -- two NICs both called "web" in different
#    resource groups -- raise IntegrityError, which rolls back the whole
#    transaction and loses EVERY audit record for that job, not just the
#    colliding pair. `event_queries_processed` is rolled back with it, so the
#    fallback task re-picks the job and fails again until it ages out. `name`
#    is therefore the full ARM id, which is unique by construction; the
#    friendly name is reported in `facts.name`, which is not constrained.
# 1. canonical_facts is the ONLY key the controller deduplicates on
#    (`results[hashable_facts]`), and `facts` and `name` are taken from the
#    first record seen. So it must hold identity and nothing else. A resource's
#    ARM id is that identity on its own; anything else in canonical_facts can
#    only split one resource into several rows. `name` used to be in here with
#    an "UNKNOWN" fallback, so the same NIC reported once through
#    azure_rm_networkinterface (name present) and once as a nested reference in
#    another resource's result (name absent) produced two audit rows.
#
#    `node_type` has moved out for the same reason, and because keeping it
#    made the key compound without making it any more discriminating: it is
#    parsed out of the ARM id itself, so the id already determines it. A
#    compound key that one of its own parts fully determines leaves `name`
#    (the id alone) looking less unique than the key, which is the thing
#    point 0 is about. node_type is still reported, in `facts.node_type`.
#
# 2. canonical_facts cannot contain null at any depth. get_hashable_form()
#    accepts int/float/str/bool/dict/list/tuple and raises UnhashableFacts on
#    anything else; the caller catches it and skips the record, logging once
#    per job at INFO with the job still green. So every value below must be
#    provably non-null, which is why the captures end in `// "unknown"`.
#
# 3. `capture(...)?` yields the EMPTY STREAM on no match, not null -- and an
#    empty stream bound with `as` produces no record at all. That is why a
#    resource group id, which has no /providers/Microsoft.X/ segment, silently
#    emitted nothing. The filter is now explicit: only ARM resource ids are
#    reported, and resource groups and subscriptions (which are containers,
#    not nodes) are excluded on purpose rather than by accident.
#
#    The guard requires a resource type AND a resource name after the
#    provider segment, so a provider-only id
#    (/subscriptions/x/providers/Microsoft.Network) and a type-only collection
#    id (.../Microsoft.Network/networkInterfaces) are both excluded. Without
#    that, the `// "unknown"` fallbacks above would turn ids that HEAD dropped
#    by accident into counted nodes -- and the type-only form would be counted
#    under a plausible-looking node_type ("network"), not an obvious one.
azure.azcollection.*:
  query: >-
    (
      {"apimanagement": "metadata",
       "authorization": "governance_ops",
       "automation": "governance_ops",
       "batch": "event_generation",
       "cache": "database",
       "cdn": "networking",
       "classiccompute": "compute",
       "compute": "compute",
       "containerinstance": "compute",
       "containerregistry": "devops_app_integration",
       "containerservice": "compute",
       "datafactory": "storage",
       "dbformariadb": "database",
       "dbformysql": "database",
       "dbforpostgresql": "database",
       "devices": "hybrid_edge_cloud",
       "documentdb": "database",
       "eventhub": "data_processing_analytics",
       "hdinsight": "data_processing_analytics",
       "insights": "data_processing_analytics",
       "keyvault": "database",
       "maintenance": "governance_ops",
       "machinelearningservices": "machine_learning",
       "managedidentity": "governance_ops",
       "managedservices": "governance_ops",
       "management": "governance_ops",
       "network": "networking",
       "operationalinsights": "data_processing_analytics",
       "recoveryservices": "storage",
       "redhatopenshift": "compute",
       "resources": "unknown",
       "servicebus": "app_integration_messaging",
       "sql": "database",
       "storage": "storage",
       "web": "devops_app_integration"
      } as $mapping |
      {"virtualmachines": "virtual_machine",
       "virtualmachinescalesets": "virtual_machine_scale_set",
       "availabilitysets": "availability_set",
       "disks": "block_storage",
       "snapshots": "block_storage",
       "images": "image",
       "storageaccounts": "file_storage",
       "blobservices": "file_storage",
       "fileservices": "file_storage",
       "vaults": "key_vault",
       "virtualnetworks": "vpc",
       "subnets": "vpc",
       "networkinterfaces": "vpc",
       "publicipaddresses": "vpc",
       "networksecuritygroups": "firewall",
       "securityrules": "firewall",
       "routetables": "router",
       "routes": "router",
       "loadbalancers": "load_balancer",
       "applicationgateways": "load_balancer",
       "frontdoors": "load_balancer",
       "dnszones": "dns",
       "privatednszones": "dns",
       "privateendpoints": "private_endpoint",
       "privatelinkservices": "private_endpoint",
       "natgateways": "nat_gateway",
       "bastionhosts": "bastion",
       "virtualnetworkgateways": "vpn_gateway",
       "vpnsites": "vpn_gateway",
       "virtualhubs": "vpn_gateway",
       "expressroutecircuits": "express_route",
       "firewalls": "firewall",
       "firewallpolicies": "firewall",
       "azurefirewalls": "firewall",
       "applicationinsights": "monitoring",
       "components": "monitoring",
       "servers": "database_relational",
       "databases": "database_relational",
       "elasticpools": "database_relational",
       "flexibleservers": "database_relational",
       "managedclusters": "kubernetes_cluster",
       "containergroups": "container_instance",
       "registries": "container_registry",
       "sites": "api_endpoint",
       "serverfarms": "app_service_plan",
       "certificates": "certificate",
       "namespaces": "messaging",
       "topics": "messaging",
       "queues": "messaging",
       "iothubs": "iot_hub",
       "locks": "resource_lock",
       "roleassignments": "iam",
       "roledefinitions": "iam",
       "policyassignments": "policy",
       "policydefinitions": "policy",
       "resourcegroups": "resource_group",
       "deployments": "deployment",
       "factories": "data_factory"
      } as $device_type_mapping |
      (.accounts //
       .aks_agent_pools //
       .ansible_facts.azure_vm //
       .ansible_facts.azure_vmss //
       .bastion_host //
       .clusters //
       .connection //
       .containerinstances //
       .database //
       .databases //
       .deployment //
       .deployments //
       .elastic_pool //
       .firewall_policy //
       .firewall_rule //
       .firewallpolicies //
       .firewalls //
       .gateways //
       .instances //
       .ip_security_restrictions //
       .keyvaults //
       .link_service //
       .loadbalancers //
       .long_term_retention_policy //
       .ml_batch_deployments //
       .ml_batch_deployment //
       .ml_batch_endpoints //
       .ml_batch_endpoint_invoke //
       .ml_batch_endpoint //
       .ml_components //
       .ml_component //
       .ml_computes //
       .ml_compute //
       .ml_connections //
       .ml_connection //
       .ml_data_assets //
       .ml_data_asset //
       .ml_datastore //
       .ml_datastores //
       .ml_environments //
       .ml_environment //
       .ml_jobs //
       .ml_job //
       .ml_models //
       .ml_model //
       .ml_online_deployments //
       .ml_online_deployment //
       .ml_online_endpoints //
       .ml_online_endpoint_invoke //
       .ml_online_endpoint //
       .ml_registries //
       .ml_registry //
       .ml_schedules //
       .ml_schedule //
       .ml_workspaces //
       .ml_workspace //
       .networkinterfaces //
       .publicipaddresses //
       .rediscaches //
       .registries //
       .resourcegroups //
       .response //
       .rules //
       .securitygroups //
       .servers //
       .servicebuses //
       .short_term_retention_policy //
       .state //
       .storageaccounts //
       .subnets //
       .virtual_hubs //
       .virtualnetworks //
       .vms //
       .vpn_sites //
       .webapps //
       .) |
      (if type=="array" then .[]
        else if type=="object" then .
              else empty end
       end
       ) as $data |
        select(($data.id | type) == "string") |
        ($data.id | ascii_downcase) as $arm_id |
        select($arm_id | test("/providers/microsoft\\.[^/]+/[^/]+/[^/]+")) |
        (
          ($arm_id | capture("/providers/microsoft\\.(?<resourcetype>[^/]+)/")? | .resourcetype)
          // "unknown"
        ) as $node_type |
        (
          ($arm_id | capture("/providers/microsoft\\.[^/]+/(?<subtype>[^/]+)/")? | .subtype)
          // "unknown"
        ) as $sub_node_type |
        {
          name: $data.id,
          canonical_facts: {
            id: $data.id
          },
          facts: {
            infra_type: "public_cloud",
            node_type: $node_type,
            infra_bucket: ($mapping[$node_type] // "unknown"),
            device_type: ($device_type_mapping[$sub_node_type] // $sub_node_type),
            name: ($data.name // ($data.id | split("/") | last))
          }
        }
    )
